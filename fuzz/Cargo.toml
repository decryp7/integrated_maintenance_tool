[package]
name = "debrief-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# A separate workspace: fuzzing needs nightly and libFuzzer and must not affect the main build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
debrief-core = { path = "../crates/debrief-core" }
debrief-ipc = { path = "../crates/debrief-ipc" }
debrief-notes = { path = "../crates/debrief-notes" }
debrief-plugin-api = { path = "../crates/debrief-plugin-api" }
debrief-plugin-package = { path = "../crates/debrief-plugin-package" }
debrief-ai = { path = "../crates/debrief-ai" }
debrief-ai-worker = { path = "../crates/debrief-ai-worker" }
debrief-plugin-registry = { path = "../crates/debrief-plugin-registry" }
debrief-plugin-windows = { path = "../crates/debrief-plugin-windows" }
debrief-plugin-web = { path = "../crates/debrief-plugin-web" }
debrief-plugin-formats = { path = "../crates/debrief-plugin-formats" }
debrief-plugin-otel = { path = "../crates/debrief-plugin-otel" }
debrief-plugin-syslog = { path = "../crates/debrief-plugin-syslog" }
debrief-profile = { path = "../crates/debrief-profile" }
debrief-plugin-profiling = { path = "../crates/debrief-plugin-profiling", default-features = false }
debrief-dump = { path = "../crates/debrief-dump" }
debrief-plugin-dumps = { path = "../crates/debrief-plugin-dumps", default-features = false }
debrief-etw = { path = "../crates/debrief-etw" }
debrief-symbols = { path = "../crates/debrief-symbols", default-features = false }
debrief-plugin-dotnet = { path = "../crates/debrief-plugin-dotnet", default-features = false }
serde_json = "1"
chrono = "0.4"

[profile.release]
debug = 1

[[bin]]
name = "fuzz_archive"
path = "fuzz_targets/fuzz_archive.rs"
test = false
doc = false
bench = false

