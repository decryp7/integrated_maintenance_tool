[package]
name = "imt-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# A separate workspace: fuzzing needs nightly and libFuzzer and must not affect the main build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
imt-core = { path = "../crates/imt-core" }
imt-ipc = { path = "../crates/imt-ipc" }
imt-plugin-api = { path = "../crates/imt-plugin-api" }
imt-ai = { path = "../crates/imt-ai" }
imt-ai-worker = { path = "../crates/imt-ai-worker" }
imt-plugin-registry = { path = "../crates/imt-plugin-registry" }
imt-plugin-windows = { path = "../crates/imt-plugin-windows" }
imt-plugin-web = { path = "../crates/imt-plugin-web" }
imt-plugin-formats = { path = "../crates/imt-plugin-formats" }
imt-plugin-otel = { path = "../crates/imt-plugin-otel" }
imt-plugin-syslog = { path = "../crates/imt-plugin-syslog" }
imt-profile = { path = "../crates/imt-profile" }
imt-plugin-profiling = { path = "../crates/imt-plugin-profiling", default-features = false }
serde_json = "1"
chrono = "0.4"

[profile.release]
debug = 1

[[bin]]
name = "fuzz_archive"
path = "fuzz_targets/fuzz_archive.rs"
test = false
doc = false
bench = false

