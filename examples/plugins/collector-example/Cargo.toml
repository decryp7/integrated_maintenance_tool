[package]
name = "debrief-example-collector"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "An example Debrief collector plugin"

# What `cargo debrief-plugin package` puts in the package manifest (name, version and description come from above;
# permissions from the plugin itself).
[package.metadata.debrief-plugin]
id = "net.decryptology.example.collector"
publisher = "Debrief examples"

[dependencies]
debrief-plugin-api = { path = "../../../crates/debrief-plugin-api" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
debrief-plugin-test = { path = "../../../crates/debrief-plugin-test" }
