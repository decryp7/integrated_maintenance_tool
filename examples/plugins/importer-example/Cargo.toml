[package]
name = "imt-example-importer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "An example IMT importer plugin: key=value log lines"

# What `cargo imt-plugin package` puts in the package manifest (name, version and description come from above;
# permissions from the plugin itself).
[package.metadata.imt-plugin]
id = "net.decryptology.example.kv-lines"
publisher = "IMT examples"

[dependencies]
imt-plugin-api = { path = "../../../crates/imt-plugin-api" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
imt-plugin-test = { path = "../../../crates/imt-plugin-test" }
