[workspace]
members = ["crates/imt-core", "crates/imt-plugin-registry", "crates/imt-plugin-windows", "crates/imt-plugin-web", "crates/imt-plugin-formats", "crates/imt-plugin-otel", "crates/imt-plugin-syslog", "crates/imt-plugin-tools", "crates/imt-monitor", "crates/imt-collect", "crates/imt-pdf", "crates/imt-agent", "crates/imt-profile", "crates/imt-plugin-profiling", "crates/imt-ai", "crates/imt-ai-worker", "crates/imt-ipc", "crates/imt-plugin-sdk", "crates/imt-plugin-host", "app/src-tauri"]
# The persistent-store spike (docs/store-spike.md) builds on its own: it needs DataFusion and a prebuilt
# libduckdb, which no shipped crate uses.
exclude = ["crates/imt-store-spike"]
resolver = "2"

# Shared by every member: `edition.workspace = true` etc.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# The newest rust-version among the dependencies (sysinfo 0.39); CI builds with stable.
rust-version = "1.95"
repository = "https://dev.decryptology.net/decryp7/integrated_maintenance_tool"

# Versions of the dependencies that two or more members use, so they stay on one version. Members inherit with
# `name.workspace = true` and add the features they need (features are additive). Crates with
# `default-features = false` here can't turn the defaults back on in a member.
[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
bytes = "1"
chrono = "0.4.45"
csv = "1.4"
ctrlc = "3"
flate2 = "1.1"
getrandom = "0.4"
globset = "0.4.20"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
insta = { version = "1", features = ["yaml"] }
libc = "0.2"
log = "0.4"
proptest = "1.12"
prost = "0.14"
protox = "0.9"
quick-xml = "0.42"
regex = "1.13"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
toml = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
# Every Windows API user needs these; members add the API areas they call.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dependencies are optimised even in debug builds: parsing, regex and compression run at a usable speed in
# `tauri dev` and in the tests, and they are compiled once. Workspace crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

# Shipped builds (tag builds and installers: `cargo build --profile dist`, `tauri build -- --profile dist`):
# release plus cross-crate inlining, one codegen unit and no symbols. Slower to build, so day-to-day
# `--release` builds keep the defaults.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
