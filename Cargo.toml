[workspace]
members = ["crates/imt-core", "crates/imt-plugin-api", "crates/imt-batch", "crates/imt-plugin-registry", "crates/imt-plugin-windows", "crates/imt-plugin-web", "crates/imt-plugin-formats", "crates/imt-plugin-otel", "crates/imt-plugin-syslog", "crates/imt-plugin-tools", "crates/imt-monitor", "crates/imt-collect", "crates/imt-pdf", "crates/imt-agent", "crates/imt-profile", "crates/imt-plugin-profiling", "crates/imt-plugin-dotnet", "crates/imt-ai", "crates/imt-ai-worker", "crates/imt-ipc", "crates/imt-plugin-host", "crates/imt-plugins", "crates/imt-store-duck", "crates/imt-store-client", "crates/imt-store-worker", "app/src-tauri", "xtask"]
# The persistent-store spike (docs/store-spike.md) builds on its own: it needs DataFusion, which no shipped crate
# uses. The store crates (imt-store-duck, imt-store-worker) link the official prebuilt libduckdb: every build needs
# `DUCKDB_LIB_DIR`/`DUCKDB_INCLUDE_DIR` from `crates/imt-store-duck/scripts/fetch-libduckdb.sh` (docs/development.md).
exclude = ["crates/imt-store-spike"]
resolver = "2"

# Shared by every member: `edition.workspace = true` etc.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# The newest rust-version among the dependencies (sysinfo 0.39); CI builds with stable.
rust-version = "1.95"
repository = "https://dev.decryptology.net/decryp7/integrated_maintenance_tool"

# Versions of the dependencies that two or more members use, so they stay on one version. Members inherit with
# `name.workspace = true` and add the features they need (features are additive). Crates with
# `default-features = false` here can't turn the defaults back on in a member.
[workspace.dependencies]
anyhow = "1.0"
# Arrow 58: the version duckdb-rs 1.10506 (DuckDB 1.5.6) links, so event batches reach the store without a
# conversion; `arrow-ipc` carries batches between the store worker and IMT (ADR 0014 6c).
arrow-array = { version = "58", default-features = false }
arrow-buffer = { version = "58", default-features = false }
arrow-ipc = { version = "58", default-features = false }
arrow-schema = { version = "58", default-features = false }
base64 = "0.23"
bytes = "1"
chrono = "0.4.45"
csv = "1.4"
# DuckDB 1.5.6 (MIT), pinned to the prebuilt library the fetch script verifies; never `bundled` (several GB of RAM
# to compile).
duckdb = { version = "=1.10506.1", default-features = false }
ctrlc = "3"
flate2 = "1.1"
getrandom = "0.4"
globset = "0.4.20"
insta = { version = "1", features = ["yaml"] }
libc = "0.2"
log = "0.4"
memory-stats = "1.2"
# Event segments of the store: zstd Parquet (Apache-2.0), the Arrow version of duckdb-rs.
parquet = { version = "58", default-features = false }
# The frame codec of every IPC connection (ADR 0017): serde, compact, no schema compiler.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1.12"
# The pprof file format (profile.proto) in the profiling plugin; not used for IPC (ADR 0017).
prost = "0.14"
quick-xml = "0.42"
rayon = "1.12"
regex = "1.13"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false }
tantivy = { version = "0.27", default-features = false }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false }
toml = "1"
# Every Windows API user needs these; members add the API areas they call.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dependencies are optimised even in debug builds: parsing, regex and compression run at a usable speed in
# `tauri dev` and in the tests, and they are compiled once. Workspace crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

# Shipped builds (tag builds and installers: `cargo build --profile dist`, `tauri build -- --profile dist`):
# release plus cross-crate inlining, one codegen unit and no symbols. Slower to build, so day-to-day
# `--release` builds keep the defaults.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
