[package]
name = "imt-app"
license = "MIT OR Apache-2.0"
version = "0.1.0"
description = "IMT — integrated maintenance tool for analysing logs and diagnostic files"
authors = ["decryp7"]
edition = "2021"
publish = false
rust-version = "1.85"

[lib]
name = "imt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
imt-core = { path = "../../crates/imt-core" }
imt-plugin-registry = { path = "../../crates/imt-plugin-registry" }
imt-plugin-otel = { path = "../../crates/imt-plugin-otel" }
imt-plugin-syslog = { path = "../../crates/imt-plugin-syslog" }
imt-plugin-windows = { path = "../../crates/imt-plugin-windows" }
imt-plugin-web = { path = "../../crates/imt-plugin-web" }
imt-monitor = { path = "../../crates/imt-monitor" }
imt-collect = { path = "../../crates/imt-collect" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = { version = "0.4", features = ["kv"] }
chrono = "0.4.45"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
notify-debouncer-mini = "0.7"
base64 = "0.22"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test", "tray-icon", "image-png"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
