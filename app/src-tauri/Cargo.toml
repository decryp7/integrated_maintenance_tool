[package]
name = "imt-app"
license = "MIT OR Apache-2.0"
version = "0.1.0"
description = "IMT — integrated maintenance tool for analysing logs and diagnostic files"
authors = ["decryp7"]
edition = "2021"
publish = false
rust-version = "1.85"

[lib]
name = "imt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
imt-core = { path = "../../crates/imt-core" }
imt-pdf = { path = "../../crates/imt-pdf" }
imt-plugin-registry = { path = "../../crates/imt-plugin-registry" }
imt-plugin-otel = { path = "../../crates/imt-plugin-otel" }
imt-plugin-syslog = { path = "../../crates/imt-plugin-syslog" }
imt-plugin-windows = { path = "../../crates/imt-plugin-windows" }
imt-plugin-web = { path = "../../crates/imt-plugin-web" }
imt-plugin-profiling = { path = "../../crates/imt-plugin-profiling" }
imt-profile = { path = "../../crates/imt-profile" }
imt-plugin-tools = { path = "../../crates/imt-plugin-tools" }
imt-agent = { path = "../../crates/imt-agent" }
imt-plugin-host = { path = "../../crates/imt-plugin-host" }
imt-plugin-sdk = { path = "../../crates/imt-plugin-sdk" }
imt-ai = { path = "../../crates/imt-ai" }
imt-collect = { path = "../../crates/imt-collect" }
# Child-process logs (`imt_ipc::child_log`) for problem reports.
imt-ipc = { path = "../../crates/imt-ipc" }
# IMT's folders for `--export-diagnostics` without starting Tauri (the same crate Tauri resolves them with).
dirs = "7"
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = { version = "0.4", features = ["kv"] }
chrono = "0.4.45"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
tracing-appender = "0.2.5"
tracing-log = { version = "0.2", default-features = false, features = ["std"] }
# >= 2.12 fixes GHSA-j38x-g3m3-95fr (downgrade through the unsigned manifest version), 2.13.3 rejects non-canonical signatures: see `updater.rs`.
# No "zip": IMT publishes v2 updater artifacts (the installers themselves), and zip 4 has open advisories.
# "rustls-tls" is reqwest 0.13's `rustls-no-provider`, whose default verifier is rustls-platform-verifier: update checks
# trust the OS certificate store like the AI downloads (`imt_ai::net`), so they work behind TLS-inspecting proxies.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
notify-debouncer-mini = "0.7"
base64 = "0.22"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test", "tray-icon", "image-png"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
