[package]
name = "imt-app"
license.workspace = true
repository.workspace = true
version = "0.1.0"
description = "IMT — integrated maintenance tool for analysing logs and diagnostic files"
authors = ["decryp7"]
edition.workspace = true
publish = false
rust-version.workspace = true

[lib]
name = "imt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The live test of research against the real search engines (`browser::live_probe`, `npm run e2e:tauri:build:live`).
# Debug end-to-end builds only: a release build with it fails to compile, so it never ships.
live-search-probe = []

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
imt-alloc = { path = "../../crates/imt-alloc" }
imt-core = { path = "../../crates/imt-core" }
imt-pdf = { path = "../../crates/imt-pdf" }
imt-profile = { path = "../../crates/imt-profile" }
# Dumps and UMDH logs (ADR 0023): the engine; the readers run in the dumps plugin's process.
imt-dump = { path = "../../crates/imt-dump" }
imt-notes = { path = "../../crates/imt-notes" }
imt-agent = { path = "../../crates/imt-agent" }
# Plugins run out of process (ADR 0017): the host side only; no plugin is linked into the app.
imt-plugin-host = { path = "../../crates/imt-plugin-host" }
imt-plugin-api = { path = "../../crates/imt-plugin-api" }
imt-plugin-package = { path = "../../crates/imt-plugin-package" }
imt-ai = { path = "../../crates/imt-ai" }
imt-collect = { path = "../../crates/imt-collect" }
# Child-process logs (`imt_ipc::child_log`) for problem reports.
imt-ipc = { path = "../../crates/imt-ipc" }
# The store worker's client (ADR 0014): every window's store over the worker; links no database.
imt-store-client = { path = "../../crates/imt-store-client" }
# IMT's folders for `--export-diagnostics` without starting Tauri (the same crate Tauri resolves them with).
dirs = "7"
open = "5"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log = { workspace = true, features = ["kv"] }
chrono.workspace = true
# "macos-private-api": a transparent webview for the drag ghost on macOS (`drag_ghost`; with `app.macOSPrivateApi`).
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
tracing-appender = "0.2.5"
tracing-log = { version = "0.2", default-features = false, features = ["std"] }
# >= 2.12 fixes GHSA-j38x-g3m3-95fr (downgrade through the unsigned manifest version), 2.13.3 rejects non-canonical signatures: see `updater.rs`.
# No "zip": IMT publishes v2 updater artifacts (the installers themselves), and zip 4 has open advisories.
# "rustls-tls" is reqwest 0.13's `rustls-no-provider`, whose default verifier is rustls-platform-verifier: update checks
# trust the OS certificate store like the AI downloads (`imt_ai::net`), so they work behind TLS-inspecting proxies.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver.workspace = true
notify-debouncer-mini = "0.7"
base64.workspace = true
sysinfo = { workspace = true, features = ["system"] }
zip.workspace = true
# Error snapshots (ADR 0034): bound and re-encode the native webview capture off the UI thread. Already in the
# tree through tauri (same version and codecs); no new crates.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Awaits the webview's capture callback with a timeout (`window_capture`), on the runtime tauri already runs.
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
# The store in process for the shell's tests (the real adapter on a temp folder).
imt-store-duck = { path = "../../crates/imt-store-duck" }
# The profile importers as a library, for the profiling store's tests (in IMT they run in the profiling plugin's process).
imt-plugin-profiling = { path = "../../crates/imt-plugin-profiling", default-features = false }
# The dump readers as a library, for the dumps store's tests (in IMT they run in the dumps plugin's process).
imt-plugin-dumps = { path = "../../crates/imt-plugin-dumps", default-features = false }
# The dump DTOs' TypeScript bindings (`generated_types`).
imt-dump = { path = "../../crates/imt-dump", features = ["ts"] }
imt-notes = { path = "../../crates/imt-notes", features = ["ts"] }
# The Store pane's DTOs' TypeScript bindings (`generated_types`, ADR 0030).
imt-core = { path = "../../crates/imt-core", features = ["ts"] }
# TypeScript bindings of the wire types (`generated_types` test; ADR 0016).
ts-rs = "11.1"
# The base64 that tauri-plugin-updater's `Error::Base64` wraps, to build that error in the updater tests.
updater-base64 = { package = "base64", version = "0.22" }
tauri = { version = "2.12.4", features = ["test", "tray-icon", "image-png", "unstable", "macos-private-api"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
# Native window capture (`window_capture::native`, ADR 0034): the versions wry uses.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Native window capture (`window_capture::native`, ADR 0034): the versions wry pins.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
cairo-rs = "0.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
