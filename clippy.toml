# Every child process Debrief starts goes through `debrief_core::process::quiet_command` (or the ipc crate's spawner),
# so none opens a console window on Windows. Tests and build scripts may allow this lint.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "use debrief_core::process::quiet_command: it opens no console window on Windows" },
    { path = "tokio::process::Command::new", allow-invalid = true, reason = "use debrief_core::process::quiet_command: it opens no console window on Windows" },
]
