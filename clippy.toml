# Every child process IMT starts goes through `imt_core::process::quiet_command` (or the ipc crate's spawner),
# so none opens a console window on Windows. Tests and build scripts may allow this lint.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "use imt_core::process::quiet_command: it opens no console window on Windows" },
    { path = "tokio::process::Command::new", reason = "use imt_core::process::quiet_command: it opens no console window on Windows" },
]
