# rust-analyzer settings for this workspace (read by every client: editors, Serena, Claude Code).
# The workspace is large and agents build it in parallel on the same machine, so the language server is kept lean:
# two full instances (4+ GB each) helped exhaust memory (2026-10-21). Builds, clippy and tests stay the source of
# truth for errors; rust-analyzer is for navigation.

# No `cargo check` on save: CI and the agents' gates run clippy.
checkOnSave = false

[cargo]
# Build scripts and proc macros stay on, so derives (serde, thiserror) resolve. They are the expensive part: run
# only one rust-analyzer per checkout (Serena's), not one per tool.
buildScripts.enable = true

[procMacro]
enable = true

[cachePriming]
# Index lazily instead of priming the whole dependency graph at start-up.
enable = false

[files]
# Build output, fuzz corpora and the store spike are never edited by hand.
exclude = ["target", "app/src-tauri/target", "fuzz/target", "fuzz/corpus", "crates/imt-store-spike", "app/node_modules"]

[lru]
# Fewer cached syntax trees (default 128).
capacity = 64
