# cargo-about configuration for THIRD_PARTY_NOTICES.md (see scripts/notices/generate.sh).
# Keep `accepted` in sync with [licenses].allow in deny.toml.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
# Dev-only dependencies are not shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# All targets: the installers are built for Windows, macOS and Linux.
workarounds = []
