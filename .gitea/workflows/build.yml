# Builds IMT on every push and pull request; a v* tag also publishes a Gitea
# release with the installers attached.
#
# Runner labels: ubuntu-latest, windows-latest, macos-latest. Adjust `runs-on`
# if your act_runner instances use other labels.
# Linux jobs run in the catthehacker/ubuntu:act-latest container (Node for JavaScript actions, git,
# and sudo-free root), since the runner's default ubuntu-latest image has no Node.
# Releases need a repository secret RELEASE_TOKEN (a Gitea access token with
# write:repository scope).

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch (or pull request) supersedes the run still going; tags have their own ref,
# so releases are never cancelled by later pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks run as parallel jobs; the installers and smoke tests wait for all of them. Cargo caches are
  # restored and saved separately (actions/cache/restore + save with `if: always()`), so a failing run still
  # warms the cache for the next one; a cache is saved again when Cargo.lock changes. Each job keys its own cache.

  rust-lint:
    name: rust format + clippy
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cheap and first: a formatting slip fails in seconds.
      - name: Format
        run: cargo fmt --all --check

      - name: Linux dependencies for Tauri
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake

      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Saved only when the dependencies changed (no exact hit): the workspace's own crates rebuild anyway, and
      # uploading the whole target folder on every run cost about a minute per job.
      - uses: actions/cache/save@v4
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  rust-test:
    name: rust tests
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Linux dependencies for Tauri
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake

      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      # nextest runs every test in its own process, in parallel across crates, and reports every failure;
      # .config/nextest.toml serialises (and retries) the tests that time real child processes.
      - name: Tests
        run: cargo nextest run --workspace --no-fail-fast

      # nextest does not run doc tests.
      - name: Doc tests
        run: cargo test --workspace --doc

      # Saved only when the dependencies changed (no exact hit): the workspace's own crates rebuild anyway, and
      # uploading the whole target folder on every run cost about a minute per job.
      - uses: actions/cache/save@v4
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  licences:
    name: licences, notices + commits
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so pull requests can check every commit message.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-deny

      # cargo about reads every crate's licence from its sources and cargo deny clones the advisory database:
      # without a cache both download everything on every run.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-dbs
          key: licences-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: licences-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: node scripts/commit-lint.mjs --range "origin/${{ github.base_ref }}..HEAD"

      # The binary, not the Docker-based action: no image to pull on every run. Every workspace crate, not just
      # the root package.
      - name: Licences, advisories and sources
        run: cargo deny --all-features --workspace check

      - name: Third-party notices are up to date
        run: |
          node --test scripts/notices/generate.test.mjs app/scripts/build-info.test.mjs scripts/commit-lint.test.mjs
          scripts/notices/generate.sh
          git diff --exit-code -- app/src-tauri/resources app/src/app/about/generated

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-dbs
          key: licences-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

  frontend:
    name: frontend build, lint + unit tests
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Frontend build
        run: npx ng build

      - name: Translations are extracted and the pseudo-locale builds
        run: |
          node --test scripts/i18n/locales.test.mjs
          npx ng extract-i18n --output-path .i18n-check 2>&1 | tee .i18n-check.log
          if grep -qi 'duplicate' .i18n-check.log; then echo 'Duplicate i18n message ids (see above)'; exit 1; fi
          node scripts/i18n/build-locales.mjs --check .i18n-check/messages.xlf

      - name: Frontend unit tests
        run: npx ng test --watch=false --coverage

  e2e:
    name: end-to-end (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Frontend end-to-end tests
        env:
          CI: "true"
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-${{ matrix.shard }}
          path: app/playwright-report
          if-no-files-found: ignore

  # A few WebdriverIO smoke tests of the real app (engine + shell + production UI, no mock), through
  # tauri-driver: msedgedriver for WebView2 on Windows, WebKitWebDriver (webkit2gtk-driver) under Xvfb on Linux.
  # macOS has no WKWebView driver. Locally: see docs/testing-manual.md ("Smoke tests of the real app").
  tauri-smoke:
    name: real-app smoke (${{ matrix.os }})
    needs: [rust-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Linux legs run in the act image (Node and the usual tools); Windows and macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && 'catthehacker/ubuntu:act-latest' || '' }}
    timeout-minutes: 60
    # Windows runners usually run as administrator, where WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS (how
    # msedgedriver enables remote debugging); the debug build hands those arguments to WebView2 itself, so both legs
    # are required. Each run keeps IMT's folders in a temp IMT_DATA_DIR (see app/e2e-tauri/wdio.conf.ts).
    steps:
      - uses: actions/checkout@v4

      # Host-mode Windows runners may not have Git's bash on PATH; actions (rust-toolchain) and `shell: bash` need it.
      # Also keeps the Rust build folder outside the job's checkout, so the next run builds incrementally instead of
      # from scratch (host runners keep their disk; the Linux legs use the cache instead).
      - name: Git bash on PATH and a persistent build folder (Windows)
        if: runner.os == 'Windows'
        # cmd, not PowerShell: runners with a restricted execution policy refuse the .ps1 act writes for a step.
        shell: cmd
        run: |
          rem Which account runs the job: WebView2 smoke tests cannot run as SYSTEM (its temp is C:\Windows\SystemTemp).
          whoami
          echo TEMP=%TEMP%
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner: no bash.exe in "%ProgramFiles%\Git\bin" & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          rem One build folder per job: the smoke (debug) and installer (release) jobs run at the same time and
          rem would otherwise wait for each other on the cargo lock.
          if defined RUNNER_TOOL_CACHE (set "IMT_TARGET=%RUNNER_TOOL_CACHE%\imt-target-%GITHUB_JOB%") else (set "IMT_TARGET=%USERPROFILE%\.imt-ci-target-%GITHUB_JOB%")
          echo CARGO_TARGET_DIR=%IMT_TARGET%>>"%GITHUB_ENV%"

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies for Tauri and WebDriver
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake \
            webkit2gtk-driver xvfb dbus dbus-x11

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/tauri-driver
            ~/.cargo/bin/tauri-driver.exe
            target
          key: smoke-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: smoke-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: tauri-driver
        shell: bash
        run: command -v tauri-driver || cargo install tauri-driver --locked

      # The Edge WebDriver must match the runner's WebView2 runtime exactly: the script reads the runtime's
      # version from the registry (EdgeUpdate client {F3017226-…}) and downloads
      # https://msedgedriver.microsoft.com/<version>/edgedriver_win64.zip into app/e2e-tauri/.drivers/.
      - name: Edge WebDriver matching WebView2
        if: runner.os == 'Windows'
        working-directory: app
        shell: bash
        run: node e2e-tauri/scripts/fetch-msedgedriver.mjs

      - name: Debug app binary
        working-directory: app
        shell: bash
        run: |
          npm ci
          npm run e2e:tauri:build

      - name: Smoke tests (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: bash
        # Keep IMT's folders so a failure can show the app's own logs (next step).
        env:
          IMT_E2E_KEEP_DATA: "1"
        run: npm run e2e:tauri

      - name: IMT logs of the failed smoke run (Windows)
        if: failure() && runner.os == 'Windows'
        working-directory: app
        shell: bash
        run: |
          for f in $(find e2e-tauri/.tmp -path '*imt-e2e-*' -name '*.log' 2>/dev/null | sort); do
            echo "::group::$f"; tail -n 150 "$f"; echo "::endgroup::"
          done
          tasklist //FI "IMAGENAME eq imt-app.exe" || true

      # A session bus for the single-instance plugin and notifications, and a virtual display for WebKitGTK.
      - name: Smoke tests (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        # WebKitGTK in a CI container: its web-process sandbox (bubblewrap) cannot start as root inside Docker, and
        # there is no GPU. These switches apply to this throwaway test container only, never to IMT itself.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Keep IMT's folders so a failure can show the app's own logs (next step).
          IMT_E2E_KEEP_DATA: "1"
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run e2e:tauri

      - name: IMT logs of the failed smoke run (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          for f in $(find /tmp -path '*imt-e2e-*' -name '*.log' 2>/dev/null | sort); do
            echo "::group::$f"; tail -n 150 "$f"; echo "::endgroup::"
          done
          dmesg 2>/dev/null | tail -n 30 || true

      # Screenshots and page sources of failed smoke tests (wdio.conf.ts `afterTest`).
      - name: Smoke test failures
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: tauri-smoke-${{ runner.os }}
          path: app/e2e-tauri/.artifacts
          if-no-files-found: ignore

  bundle:
    name: bundle (${{ matrix.os }})
    needs: [rust-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
          - os: windows-latest
            bundles: nsis
          # macOS is off until a runner with the macos-latest label is registered (see docs/releasing.md);
          # uncomment to build the .dmg again.
          # - os: macos-latest
          #   bundles: dmg
    runs-on: ${{ matrix.os }}
    # Linux legs run in the act image (Node and the usual tools); Windows and macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && 'catthehacker/ubuntu:act-latest' || '' }}
    steps:
      - uses: actions/checkout@v4

      # Host-mode Windows runners may not have Git's bash on PATH; actions (rust-toolchain) and `shell: bash` need it.
      # Also keeps the Rust build folder outside the job's checkout, so the next run builds incrementally instead of
      # from scratch (host runners keep their disk; the Linux legs use the cache instead).
      - name: Git bash on PATH and a persistent build folder (Windows)
        if: runner.os == 'Windows'
        # cmd, not PowerShell: runners with a restricted execution policy refuse the .ps1 act writes for a step.
        shell: cmd
        run: |
          rem Which account runs the job: WebView2 smoke tests cannot run as SYSTEM (its temp is C:\Windows\SystemTemp).
          whoami
          echo TEMP=%TEMP%
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner: no bash.exe in "%ProgramFiles%\Git\bin" & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          rem One build folder per job: the smoke (debug) and installer (release) jobs run at the same time and
          rem would otherwise wait for each other on the cargo lock.
          if defined RUNNER_TOOL_CACHE (set "IMT_TARGET=%RUNNER_TOOL_CACHE%\imt-target-%GITHUB_JOB%") else (set "IMT_TARGET=%USERPROFILE%\.imt-ci-target-%GITHUB_JOB%")
          echo CARGO_TARGET_DIR=%IMT_TARGET%>>"%GITHUB_ENV%"

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm cmake

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bundle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: bundle-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # Signed updater artifacts (docs/releasing.md): with the signing secrets set, Tauri writes a .sig next to
      # every installer (v2 updater artifacts: the installers themselves, plus IMT.app.tar.gz on macOS; never
      # v1 zips) and the public key is built into the app. Without them (forks, pull requests) the app has no
      # update key and reports "updates are not available in this build".
      - name: Build installers
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          npm ci
          ../scripts/notices/generate.sh
          bundles='${{ matrix.bundles }}'
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            # macOS updates install from the .app bundle's archive.
            if [ "$RUNNER_OS" = macOS ]; then bundles="app,$bundles"; fi
            mkdir -p ../target
            node -e 'process.stdout.write(JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.TAURI_UPDATER_PUBKEY } } }))' > ../target/updater.conf.json
            npx tauri build --bundles "$bundles" --config src-tauri/tauri.sidecars.conf.json --config ../target/updater.conf.json
          else
            echo '::warning::No updater signing secrets: this build cannot update itself.'
            unset TAURI_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            npx tauri build --bundles "$bundles" --config src-tauri/tauri.sidecars.conf.json
          fi

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          dir="${CARGO_TARGET_DIR:-target}"
          # Git bash on Windows: turn C:\... into a path find understands.
          if command -v cygpath >/dev/null; then dir="$(cygpath -u "$dir")"; fi
          find "$dir/release/bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} dist/ \;
          ls -la dist

      # Gitea Actions supports upload/download-artifact v3.
      - uses: actions/upload-artifact@v3
        with:
          name: imt-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, tauri-smoke, rust-lint, rust-test, licences, frontend, e2e]
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v3
        with:
          path: artifacts

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc

      - name: Release notes (git-cliff)
        run: |
          cargo install git-cliff --locked
          git cliff --latest --strip header -o artifacts/RELEASE_NOTES.md

      - name: SBOMs (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path app/src-tauri/Cargo.toml --format json --override-filename imt-rust.cdx
          cp app/src-tauri/imt-rust.cdx.json artifacts/
          (cd app && npm ci && npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file ../artifacts/imt-ui.cdx.json)

      # latest.json for the updater: version, notes from RELEASE_NOTES.md, pub_date and, per platform, the
      # installer's URL in this release, its signature (.sig) and size. Installed apps fetch
      # releases/download/latest/latest.json, i.e. from the latest (non-pre-release) release.
      - name: Updater manifest (latest.json)
        shell: bash
        run: |
          node --test scripts/release
          if ! find artifacts -name '*.sig' | grep -q .; then
            echo '::warning::No signed updater artifacts; latest.json is not published (installed apps will not see this release).'
            exit 0
          fi
          tag='${{ github.ref_name }}'
          node scripts/release/latest-json.mjs --dir artifacts --version "$tag" --notes artifacts/RELEASE_NOTES.md \
            --base-url "${{ github.server_url }}/${{ github.repository }}/releases/download/$tag" --out artifacts/latest.json
          # The signatures are in latest.json; the .sig files are not release assets.
          find artifacts -name '*.sig' -delete
          cat artifacts/latest.json

      - uses: https://gitea.com/actions/release-action@main
        with:
          files: artifacts/**/*
          api_key: ${{ secrets.RELEASE_TOKEN }}
