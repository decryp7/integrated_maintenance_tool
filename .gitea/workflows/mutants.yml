# Mutation testing of the engine with cargo-mutants: how many deliberately injected bugs the tests catch.
# Weekly over all of debrief-core; on pull requests only the mutants in the changed lines (--in-diff).
# Surviving mutants are listed in mutants.out (uploaded); they point at untested behaviour.

name: mutants

on:
  schedule:
    - cron: "41 3 * * 0"
  pull_request:
    paths: ["crates/debrief-core/**"]
  workflow_dispatch:

# A newer push to the same branch supersedes a running pull request run (the weekly run has its own group).
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether this run is needed at all:
  # the weekly run is skipped while main is unchanged since the last green one.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      # Exact-key lookup only: nothing is downloaded. The marker is saved by the weekly-mark job after a fully green run.
      - uses: actions/cache/restore@v4
        id: green
        if: github.event_name == 'schedule'
        with:
          path: .nightly-green
          key: mutants-weekly-green-${{ github.sha }}
          lookup-only: true

      - name: Decide
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
        run: |
          run=true
          if [ "$EVENT" = schedule ] && [ "$GREEN" = true ]; then
            run=false
            echo "::notice::main has not changed since the last green run ($SHA); skipping."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  mutants:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-mutants
          key: mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: mutants-${{ runner.os }}-

      - name: Install cargo-mutants
        run: command -v cargo-mutants || cargo install cargo-mutants --locked

      - name: Mutants in the changed lines
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- crates/debrief-core > pr.diff
          cargo mutants -p debrief-core --in-diff pr.diff --timeout-multiplier 3 --no-shuffle

      - name: Mutants in debrief-core
        if: github.event_name != 'pull_request'
        run: cargo mutants -p debrief-core --timeout-multiplier 3 --jobs 2

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore

  # Records a fully green scheduled run for this commit; `plan` skips the next scheduled run while main is unchanged.
  # Never runs when anything failed, so a red commit is retried every night.
  weekly-mark:
    name: weekly-mark
    needs: [mutants]
    if: github.event_name == 'schedule' && success()
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    steps:
      - name: Marker file
        run: |
          mkdir -p .nightly-green
          echo "${{ github.sha }}" > .nightly-green/sha

      - uses: actions/cache/save@v4
        with:
          path: .nightly-green
          key: mutants-weekly-green-${{ github.sha }}
