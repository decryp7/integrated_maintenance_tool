# Nightly fuzzing of every parser with cargo-fuzz (libFuzzer, nightly Rust).
# Each target runs for FUZZ_SECONDS; any crash fails the job and its reproducer is
# uploaded as an artifact. Triage: see docs/fuzzing.md.

name: fuzz

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "300"

env:
  CARGO_TERM_COLOR: always
  FUZZ_SECONDS: ${{ github.event.inputs.seconds || '300' }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_json
          - fuzz_csv
          - fuzz_text
          - fuzz_timestamp
          - fuzz_profile_toml
          - fuzz_ql
          - fuzz_archive
          - fuzz_registry
          - fuzz_evtx
          - fuzz_w3c_access_har
          - fuzz_otel
          - fuzz_syslog
          - fuzz_perfmon_csv
          - fuzz_prof_speedscope
          - fuzz_prof_folded
          - fuzz_prof_cpuprofile
          - fuzz_prof_chrome_trace
          - fuzz_prof_pprof
          - fuzz_prof_perf_script
          - fuzz_prof_nettrace
          - fuzz_prof_heapsnapshot
          - fuzz_procmon_csv
          - fuzz_minidump
          - fuzz_eventlog
          - fuzz_log4j_xml
          - fuzz_sql_errorlog
          - fuzz_docker_json
          - fuzz_cri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock') }}
          restore-keys: fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          mkdir -p work/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} work/${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time=$FUZZ_SECONDS -rss_limit_mb=2048 -max_len=131072 -timeout=20

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
