# Engine benchmarks (crates/imt-core/benches) on every push to main. A quick
# criterion pass keeps the job short; the HTML report is uploaded as an
# artifact so runs can be compared. Raise the input sizes locally with
# IMT_BENCH_IMPORT_LINES / IMT_BENCH_WORKSPACE_LINES.

name: bench

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: engine benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-

      - name: Benchmarks (quick)
        run: cargo bench -p imt-core --bench engine -- --quick

      - name: Upload criterion report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: warn
