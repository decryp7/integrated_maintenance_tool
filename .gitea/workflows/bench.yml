# Engine benchmarks (crates/imt-core/benches) on pushes to main that change the
# engine, nightly and on demand. A quick criterion pass keeps the job short; the
# HTML report is uploaded as an artifact so runs can be compared. Raise the input sizes locally with
# IMT_BENCH_IMPORT_LINES / IMT_BENCH_WORKSPACE_LINES.

name: bench

on:
  # Pushes run only when the engine changes (most pushes are UI or shell work and cannot move these numbers);
  # the nightly run still catches drift from dependency updates.
  push:
    branches: [main]
    paths:
      - "crates/imt-core/**"
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch (or pull request) supersedes the run still going; tags have their own ref,
# so releases are never cancelled by later pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: engine benchmarks
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Restore and save separately, with the run id in the saved key: a fixed key can never be updated once it
      # exists, and a failing run still warms the cache (see build.yml).
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-

      - name: Benchmarks (quick)
        run: cargo bench -p imt-core --bench engine -- --quick

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

      - name: Upload criterion report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: warn
