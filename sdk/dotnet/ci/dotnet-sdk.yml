# C#/.NET plugin SDK (sdk/dotnet): build with warnings as errors, tests with coverage, vulnerability and licence
# checks, then publish the examples as self-contained single files and run IMT's conformance kit and the
# end-to-end import against them. Copy to .gitea/workflows/dotnet-sdk.yml.
#
# Runner labels: ubuntu-latest, windows-latest (adjust to your act_runner labels). Gitea Actions needs the v3
# artifact actions. Renovate pins the actions to digests.

name: dotnet-sdk

on:
  push:
    branches: [main]
    paths: ["sdk/dotnet/**", "proto/**", "crates/imt-ipc/**", "crates/imt-plugin-sdk/**", "crates/imt-plugin-host/**", "crates/imt-core/**", ".gitea/workflows/dotnet-sdk.yml"]
  pull_request:
    paths: ["sdk/dotnet/**", "proto/**", "crates/imt-ipc/**", "crates/imt-plugin-sdk/**", "crates/imt-plugin-host/**", "crates/imt-core/**", ".gitea/workflows/dotnet-sdk.yml"]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  CARGO_TERM_COLOR: always

jobs:
  dotnet:
    name: .NET SDK (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
          - os: windows-latest
            rid: win-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: sdk/dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: sdk/dotnet/global.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.cargo/registry
            ~/.cargo/git
            sdk/dotnet/artifacts/cargo-target
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('sdk/dotnet/**/packages.lock.json', 'Cargo.lock', 'sdk/dotnet/tests/e2e-rs/Cargo.lock') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-

      - name: Restore (lock files must be current)
        run: dotnet restore Imt.Plugin.Sdk.slnx --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build Imt.Plugin.Sdk.slnx --no-restore -warnaserror

      - name: Vulnerable packages
        run: |
          dotnet list Imt.Plugin.Sdk.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Licences
        run: python3 tools/check_licenses.py

      - name: Conformance kit
        working-directory: .
        run: |
          cargo build -p imt-plugin-sdk --bin imt-plugin-check
        env:
          CARGO_TARGET_DIR: sdk/dotnet/artifacts/cargo-target

      - name: Tests with coverage (SDK >= 90% lines)
        run: |
          export IMT_PLUGIN_CHECK="$PWD/artifacts/cargo-target/debug/imt-plugin-check${{ matrix.ext }}"
          dotnet test --solution Imt.Plugin.Sdk.slnx --no-build -- \
            --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/obj/**" \
            --coverlet-does-not-return-attribute DoesNotReturnAttribute --results-directory "$PWD/artifacts/coverage"

      - name: Publish the examples (self-contained single file)
        run: |
          dotnet publish examples/ToyFormatImporter/src -c Release -r ${{ matrix.rid }}
          dotnet publish samples/OrderAudit/src -c Release -r ${{ matrix.rid }}

      - name: imt-plugin-check against the published plugins
        run: |
          check=artifacts/cargo-target/debug/imt-plugin-check${{ matrix.ext }}
          $check artifacts/plugins/com.example.toyformat/bin/${{ matrix.rid }}/toy-format-importer${{ matrix.ext }}
          $check artifacts/plugins/com.example.orderaudit/bin/${{ matrix.rid }}/order-audit${{ matrix.ext }}

      - name: End-to-end import through imt-plugin-host
        run: cargo test --manifest-path tests/e2e-rs/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/sdk/dotnet/artifacts/cargo-target

      - name: Template instantiates, builds and passes its tests
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/Imt.Plugin.Sdk -c Release -o artifacts/packages
          dotnet pack templates -c Release -o artifacts/packages
          dotnet new install artifacts/packages/Imt.Plugin.Templates.1.0.0.nupkg
          rm -rf artifacts/template-check && mkdir -p artifacts/template-check && cd artifacts/template-check
          dotnet new imt-plugin -n AcmePlugin --pluginId com.acme.plugin
          cd AcmePlugin
          dotnet restore AcmePlugin.slnx --source ../../packages --source https://api.nuget.org/v3/index.json
          dotnet test --solution AcmePlugin.slnx
          dotnet publish src/AcmePlugin -c Release -r ${{ matrix.rid }} --source ../../packages --source https://api.nuget.org/v3/index.json
          ../../cargo-target/debug/imt-plugin-check artifacts/plugin/com.acme.plugin/bin/${{ matrix.rid }}/AcmePlugin

      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dotnet-sdk-${{ matrix.rid }}
          path: |
            sdk/dotnet/artifacts/coverage
            sdk/dotnet/artifacts/plugins
            sdk/dotnet/artifacts/packages
