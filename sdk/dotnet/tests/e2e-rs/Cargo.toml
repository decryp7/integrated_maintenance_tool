# End-to-end test of the C#/.NET SDK: the published OrderAudit sample runs as a real plugin process through
# imt-plugin-host's adapter and imports into an imt-core Workspace. Not a member of the repository's workspace
# (it has its own, below) so the main build never depends on .NET.
#
#   dotnet publish sdk/dotnet/samples/OrderAudit/src -c Release -r <rid>
#   cargo test --manifest-path sdk/dotnet/tests/e2e-rs/Cargo.toml
[package]
name = "imt-dotnet-e2e"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]

[dev-dependencies]
imt-core = { path = "../../../../crates/imt-core" }
imt-plugin-host = { path = "../../../../crates/imt-plugin-host" }
imt-plugin-sdk = { path = "../../../../crates/imt-plugin-sdk" }
anyhow = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3"
