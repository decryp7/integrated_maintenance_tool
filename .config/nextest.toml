# cargo-nextest settings (CI runs `cargo nextest run --workspace`).
#
# Tests that start real child processes and time how a crash, hang or restart is detected (fake workers, fake
# plugins, the IPC fake child, the built-in plugins' processes) are sensitive to a busy machine. They run one at a time in their own group,
# and get two retries: nextest reports a test that only passed on a retry as FLAKY, so flakiness stays visible.
# Everything else runs in parallel as usual.

[test-groups]
child-processes = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
    (package(imt-ai) & binary(worker))
    | (package(imt-ai-worker) & binary(server_backend))
    | (package(imt-ipc) & (binary(launch) | binary(child_log)))
    | (package(imt-plugin-host) & binary(remote))
    | (package(imt-plugins) & kind(test))
    | (package(imt-plugin-windows) & test(eventlog::follower::))
    | (package(imt-plugin-test) & kind(test))
    | (package(imt-plugin-e2e) & kind(test))
    | (package(imt-example-*) & kind(test))
'''
test-group = 'child-processes'
retries = 2

[profile.default]
# Report a test that runs over a minute (and stop one after five) instead of letting a hang stall the run.
slow-timeout = { period = "60s", terminate-after = 5 }
