<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="t d">
  <title id="t">IMT architecture overview</title>
  <desc id="d">Many sources and collectors feed importers contributed by plugins in Rust, C# or any gRPC language; the Rust engine parses, transforms, stores, queries and analyses; the Angular and Tauri workbench shows timelines, grids, charts, analysis, profiling and AI, and shares projects, reports and bundles.</desc>
  <style>
        :root { --bg:#ffffff; --panel:#f5f7fb; --ink:#1b2130; --muted:#5a6375; --line:#c9cfdb; --a:#3869bb; --b:#e65f2a; --c:#29a077; --d:#a664fe; --soft-a:#e7eefb; --soft-b:#fdeee7; --soft-c:#e6f5ee; --soft-d:#f1eaff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f131b; --panel:#171c27; --ink:#e3e6ee; --muted:#9aa3b5; --line:#2d3546; --a:#1795fa; --b:#db551d; --c:#0a9068; --d:#b16ec0; --soft-a:#13243b; --soft-b:#2b1a12; --soft-c:#0f2a21; --soft-d:#251a2c; }
    }
    text { font-family: Arial, Helvetica, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .h { font-size: 15px; font-weight: 700; }
    .h2 { font-size: 13px; font-weight: 700; }
    .t { font-size: 12px; }
    .m { font-size: 11px; fill: var(--muted); }
    .col { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .box { stroke-width: 1.4; }
    .src { fill: var(--soft-a); stroke: var(--a); }
    .plg { fill: var(--soft-d); stroke: var(--d); }
    .eng { fill: var(--soft-c); stroke: var(--c); }
    .ui  { fill: var(--soft-b); stroke: var(--b); }
    .arrow { stroke: var(--muted); stroke-width: 2; fill: none; marker-end: url(#arr); }
    .dash { stroke-dasharray: 5 4; }
    .badge { fill: var(--bg); stroke: var(--line); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="820"/>
  <text class="h" x="24" y="32" style="font-size:20px">IMT — Integrated Maintenance Tool</text>
  <text class="m" x="24" y="52" style="font-size:12px">collect → analyse → explain → share · local-first · Windows, macOS, Linux</text>

  <!-- ===== Column 1: sources ===== -->
  <rect class="col" x="16" y="72" width="300" height="640" rx="10"/>
  <text class="h" x="32" y="98">Sources</text>

  <rect class="box src" x="32" y="110" width="268" height="96" rx="7"/>
  <text class="h2" x="44" y="130">Application logs</text>
  <text class="t" x="44" y="148">Serilog CLEF / JSON / text, log4net,</text>
  <text class="t" x="44" y="164">NLog, log4j XML, CSV, syslog / journald</text>
  <text class="t" x="44" y="180">IIS / W3C, Apache / Nginx, HAR, OTLP</text>
  <text class="t" x="44" y="196">Docker / Kubernetes, SQL Server ERRORLOG</text>

  <rect class="box src" x="32" y="216" width="268" height="80" rx="7"/>
  <text class="h2" x="44" y="236">Windows</text>
  <text class="t" x="44" y="254">Event logs (.evtx, live follower), PerfMon</text>
  <text class="t" x="44" y="270">(.blg / CSV), Process Monitor CSV,</text>
  <text class="t" x="44" y="286">registry .reg, msinfo .nfo, minidumps</text>

  <rect class="box src" x="32" y="306" width="268" height="64" rx="7"/>
  <text class="h2" x="44" y="326">Captures</text>
  <text class="t" x="44" y="344">speedscope, pprof, perf, .nettrace,</text>
  <text class="t" x="44" y="360">Chrome trace / .cpuprofile, heap snapshots</text>

  <rect class="box src" x="32" y="380" width="268" height="48" rx="7"/>
  <text class="h2" x="44" y="400">Archives &amp; folders</text>
  <text class="t" x="44" y="417">.zip, .gz, rotated / rolling sets, .imtz</text>

  <rect class="box src" x="32" y="438" width="268" height="112" rx="7"/>
  <text class="h2" x="44" y="458">Collectors (built in)</text>
  <text class="t" x="44" y="476">Process monitor + .NET runtime counters</text>
  <text class="t" x="44" y="492">Event Log follower, PerfMon sets</text>
  <text class="t" x="44" y="508">Diagnostics collector (redacted bundles)</text>
  <text class="t" x="44" y="524">imt-agent: scheduled / triggered,</text>
  <text class="t" x="44" y="540">headless or as a Windows service</text>

  <rect class="box src" x="32" y="560" width="268" height="48" rx="7"/>
  <text class="h2" x="44" y="580">Live tail</text>
  <text class="t" x="44" y="597">growing files, rotation-aware, alerts</text>

  <text class="m" x="32" y="636">Untrusted input: parsed once at the edge,</text>
  <text class="m" x="32" y="652">bounded (line, regex, archive limits),</text>
  <text class="m" x="32" y="668">fuzzed and property-tested; never panics.</text>

  <!-- ===== Column 2: plugins + engine ===== -->
  <rect class="col" x="352" y="72" width="524" height="640" rx="10"/>
  <text class="h" x="368" y="98">Plugins &amp; the Rust engine</text>

  <!-- plugins band -->
  <rect class="box plg" x="368" y="110" width="492" height="150" rx="7"/>
  <text class="h2" x="380" y="130">Plugins — importers, collectors, tools, transforms, markers, annotators</text>
  <rect class="badge" x="380" y="142" width="148" height="104" rx="6"/>
  <text class="h2" x="390" y="161">In process</text>
  <text class="t" x="390" y="179">Rust plugins</text>
  <text class="t" x="390" y="195">(Windows, web, OTel,</text>
  <text class="t" x="390" y="211">syslog, formats,</text>
  <text class="t" x="390" y="227">profiling, tools)</text>
  <rect class="badge" x="538" y="142" width="148" height="104" rx="6"/>
  <text class="h2" x="548" y="161">Out of process</text>
  <text class="t" x="548" y="179">gRPC imt.plugin.v1,</text>
  <text class="t" x="548" y="195">Arrow batches,</text>
  <text class="t" x="548" y="211">isolated, supervised,</text>
  <text class="t" x="548" y="227">permission-scoped</text>
  <rect class="badge" x="696" y="142" width="152" height="104" rx="6"/>
  <text class="h2" x="706" y="161">Any language</text>
  <text class="t" x="706" y="179">Rust SDK</text>
  <text class="t" x="706" y="195">C# / .NET SDK</text>
  <text class="t" x="706" y="211">any gRPC language</text>
  <text class="t" x="706" y="227">+ conformance tests</text>

  <!-- engine -->
  <rect class="box eng" x="368" y="276" width="492" height="420" rx="7"/>
  <text class="h2" x="380" y="296">Engine (imt-core, Rust) — single source of truth</text>

  <rect class="badge" x="380" y="308" width="226" height="88" rx="6"/>
  <text class="h2" x="390" y="327">Import &amp; profiles</text>
  <text class="t" x="390" y="345">sniff → importer → records</text>
  <text class="t" x="390" y="361">extractors, markers, badges</text>
  <text class="t" x="390" y="377">timestamps, clock-skew</text>

  <rect class="badge" x="622" y="308" width="226" height="88" rx="6"/>
  <text class="h2" x="632" y="327">Pipeline</text>
  <text class="t" x="632" y="345">drop / keep / mask / lookup</text>
  <text class="t" x="632" y="361">calculated fields, Rhai scripts</text>
  <text class="t" x="632" y="377">redaction (mask / hash / drop)</text>

  <rect class="badge" x="380" y="406" width="226" height="88" rx="6"/>
  <text class="h2" x="390" y="425">LogStore port</text>
  <text class="t" x="390" y="443">in-memory workspace</text>
  <text class="t" x="390" y="459">persistent: DuckDB worker</text>
  <text class="t" x="390" y="475">+ Tantivy (ADR 0010, planned)</text>

  <rect class="badge" x="622" y="406" width="226" height="88" rx="6"/>
  <text class="h2" x="632" y="425">Query</text>
  <text class="t" x="632" y="443">query language, facets, paging</text>
  <text class="t" x="632" y="459">timelines, charts, field stats</text>
  <text class="t" x="632" y="475">cancellable, with progress</text>

  <rect class="badge" x="380" y="504" width="468" height="70" rx="6"/>
  <text class="h2" x="390" y="523">Analysis</text>
  <text class="t" x="390" y="541">patterns (Drain), anomalies, exception groups, correlation &amp; traces,</text>
  <text class="t" x="390" y="557">compare windows, moment, config diff, dashboards, live alerts</text>

  <rect class="badge" x="380" y="584" width="226" height="98" rx="6"/>
  <text class="h2" x="390" y="603">Profiling (imt-profile)</text>
  <text class="t" x="390" y="621">hotspots, call trees, flame</text>
  <text class="t" x="390" y="637">diff, thread timeline,</text>
  <text class="t" x="390" y="653">heap dominators, paths to</text>
  <text class="t" x="390" y="669">roots, findings</text>

  <rect class="badge" x="622" y="584" width="226" height="98" rx="6"/>
  <text class="h2" x="632" y="603">Local AI (imt-ai)</text>
  <text class="t" x="632" y="621">llama-server worker, GGUF</text>
  <text class="t" x="632" y="637">models + runtimes on demand</text>
  <text class="t" x="632" y="653">cited answers; proposals the</text>
  <text class="t" x="632" y="669">engine validates first</text>

  <!-- ===== Column 3: workbench ===== -->
  <rect class="col" x="912" y="72" width="312" height="640" rx="10"/>
  <text class="h" x="928" y="98">Workbench (Angular + Tauri)</text>

  <rect class="box ui" x="928" y="110" width="280" height="200" rx="7"/>
  <text class="h2" x="940" y="130">Investigate</text>
  <text class="t" x="940" y="148">timelines per instance (several, linked)</text>
  <text class="t" x="940" y="164">virtualised events grid (50M rows)</text>
  <text class="t" x="940" y="180">facets, filters, query console</text>
  <text class="t" x="940" y="196">charts, dashboards, live tail</text>
  <text class="t" x="940" y="212">analysis &amp; profiling views</text>
  <text class="t" x="940" y="228">process monitor live charts</text>
  <text class="t" x="940" y="244">AI chat with evidence</text>
  <text class="t" x="940" y="260">docking, pop-out windows, palette</text>
  <text class="t" x="940" y="276">dark / light, WCAG 2.2 AA checks,</text>
  <text class="t" x="940" y="292">i18n-ready</text>

  <rect class="box ui" x="928" y="320" width="280" height="132" rx="7"/>
  <text class="h2" x="940" y="340">Share</text>
  <text class="t" x="940" y="358">projects with bookmarks &amp; notes</text>
  <text class="t" x="940" y="374">incident reports (HTML / PDF)</text>
  <text class="t" x="940" y="390">.imtz bundles (project + logs)</text>
  <text class="t" x="940" y="406">CSV / CLEF exports, PNG / SVG</text>
  <text class="t" x="940" y="422">redacted views, exports, bundles</text>
  <text class="t" x="940" y="438">diagnostics &amp; problem reports</text>

  <rect class="box ui" x="928" y="462" width="280" height="132" rx="7"/>
  <text class="h2" x="940" y="482">Robust by design</text>
  <text class="t" x="940" y="500">guarded plugins, quarantine</text>
  <text class="t" x="940" y="516">supervised worker processes</text>
  <text class="t" x="940" y="532">panel error boundaries, Retry</text>
  <text class="t" x="940" y="548">autosave, crash restore, safe mode</text>
  <text class="t" x="940" y="564">strict CSP, least privilege,</text>
  <text class="t" x="940" y="580">signed opt-in updates</text>

  <rect class="box ui" x="928" y="604" width="280" height="92" rx="7"/>
  <text class="h2" x="940" y="624">Local-first</text>
  <text class="t" x="940" y="642">no cloud, no telemetry; network</text>
  <text class="t" x="940" y="658">only for downloads you start</text>
  <text class="t" x="940" y="674">(models, runtimes, updates)</text>

  <!-- ===== arrows ===== -->
  <path class="arrow" d="M316,330 L362,330"/>
  <path class="arrow" d="M612,260 L612,272"/>
  <path class="arrow" d="M876,330 L922,250"/>
  <path class="arrow" d="M876,560 L922,400"/>
  <path class="arrow dash" d="M316,500 C340,500 340,200 362,200"/>

  <text class="m" x="320" y="320">import</text>
  <text class="m" x="880" y="292">IPC</text>
  <text class="m" x="320" y="520">plugin</text>
  <text class="m" x="320" y="534">collectors</text>

  <!-- legend -->
  <rect class="box src" x="24" y="740" width="16" height="12" rx="3"/><text class="m" x="46" y="751">ingest</text>
  <rect class="box plg" x="110" y="740" width="16" height="12" rx="3"/><text class="m" x="132" y="751">extend</text>
  <rect class="box eng" x="196" y="740" width="16" height="12" rx="3"/><text class="m" x="218" y="751">compute (Rust)</text>
  <rect class="box ui" x="326" y="740" width="16" height="12" rx="3"/><text class="m" x="348" y="751">see &amp; share</text>
  <text class="m" x="24" y="784">The UI never re-implements domain rules: every result is computed in Rust and reaches the workbench through the LogStore port and Tauri commands.</text>
  <text class="m" x="24" y="800">Detailed C4 and UML diagrams: docs/diagrams/*.drawio · decisions: docs/adr/</text>
</svg>
