<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMT Visual Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── Presentation page (not part of the designs) ───────────────────────── */
:root { --pg-bg:#f0f0f2; --pg-card:#ffffff; --pg-text:#18191c; --pg-muted:#55575e; --pg-line:#dcdde1; --pg-accent:#2f6fe0; color-scheme: light; }
:root[data-page="dark"] { --pg-bg:#0d0e10; --pg-card:#16171a; --pg-text:#ececee; --pg-muted:#a3a5ad; --pg-line:#2a2b30; --pg-accent:#6b9bff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--pg-bg); color: var(--pg-text); font: 14px/1.5 'Inter', system-ui, sans-serif; }
.pg { max-width: 1520px; margin: 0 auto; padding: 24px 24px 64px; }
.pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
.pg-head h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
.pg-head p { margin: 0; color: var(--pg-muted); max-width: 760px; }
.pg-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--pg-line); border-radius: 8px; overflow: hidden; background: var(--pg-card); }
.seg button { border: 0; background: transparent; color: var(--pg-muted); font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--pg-text); color: var(--pg-bg); }
.seg button:focus-visible, .dtab:focus-visible { outline: 2px solid var(--pg-accent); outline-offset: 2px; }
.dtabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0 24px; }
.dtab { text-align: left; border: 1px solid var(--pg-line); background: var(--pg-card); color: var(--pg-text); border-radius: 12px; padding: 14px 16px; cursor: pointer; font: inherit; }
.dtab b { display: block; font-size: 15px; margin-bottom: 2px; }
.dtab span { color: var(--pg-muted); font-size: 13px; }
.dtab[aria-selected="true"] { border-color: var(--pg-text); box-shadow: inset 0 0 0 1px var(--pg-text); }
.dtab .no { font: 600 11px 'JetBrains Mono', monospace; color: var(--pg-muted); letter-spacing: .06em; }
.dpanel[hidden] { display: none; }
.intro { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; margin-bottom: 20px; }
.intro h2 { margin: 0 0 6px; font-size: 20px; }
.intro p { margin: 0 0 8px; color: var(--pg-muted); }
.intro ul { margin: 0; padding-left: 18px; color: var(--pg-muted); }
.intro li { margin: 2px 0; }
.intro li b { color: var(--pg-text); font-weight: 600; }
.h3 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--pg-muted); margin: 28px 0 10px; display: flex; justify-content: space-between; gap: 12px; }
.stage { width: 100%; position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.14); }
.stage > .frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 24px; margin-top: 14px; color: var(--pg-muted); font-size: 13px; }
.notes div b { color: var(--pg-text); display: block; font-weight: 600; }
.tok { background: var(--pg-card); border: 1px solid var(--pg-line); border-radius: 12px; padding: 16px 20px; }
.tok table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.tok th { text-align: left; font-weight: 600; color: var(--pg-muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--pg-line); }
.tok td { padding: 5px 8px; border-bottom: 1px solid var(--pg-line); vertical-align: middle; }
.tok td.m { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
.tok .sw { display: inline-block; width: 22px; height: 16px; border-radius: 4px; vertical-align: middle; margin-right: 8px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
.tok .grp td { font-weight: 600; padding-top: 14px; color: var(--pg-text); border-bottom: 1px solid var(--pg-line); }
.tok .pass { color: #1a7f4b; } :root[data-page="dark"] .tok .pass { color: #6fd39b; }
.tok .fail { color: #c0262d; } :root[data-page="dark"] .tok .fail { color: #ff8a8f; }
.tokgrid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
.scale-row { display: flex; align-items: baseline; gap: 16px; padding: 4px 0; border-bottom: 1px solid var(--pg-line); }
.scale-row code { font: 11.5px 'JetBrains Mono', monospace; color: var(--pg-muted); width: 150px; flex: none; }
.spbar { height: 10px; background: var(--pg-accent); border-radius: 2px; display: inline-block; }
@media (max-width: 900px) { .intro, .tokgrid, .notes, .dtabs { grid-template-columns: 1fr; } }

/* ───────────────────────── The app mockup (shared structure; every colour is a token) ───────────────────────── */
.app { position: relative; width: 1440px; height: 900px; display: grid; grid-template-rows: var(--title-h) minmax(0, 1fr) var(--status-h);
  background: var(--bg-0); color: var(--text); font-family: var(--font-sans); font-size: var(--fs-md); line-height: 1.4; overflow: hidden;
  font-feature-settings: 'tnum' 1, 'cv11' 1; -webkit-font-smoothing: antialiased; }
.app .mono, .app code { font-family: var(--font-mono); font-feature-settings: 'tnum' 1, 'zero' 0; }
.app svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.app svg.i.s { width: 14px; height: 14px; }
.app .faint { color: var(--faint); } .app .muted { color: var(--muted); }
.app button { font: inherit; color: inherit; }
.app .btn { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: var(--r-2); border: 1px solid var(--border-3); background: var(--bg-3); color: var(--text-2); font-size: var(--fs-sm); white-space: nowrap; cursor: default; }
.app .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.app .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.app .kb { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.app .ib { width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: var(--r-1); color: var(--faint); }
.app .kbd { font-family: var(--font-mono); font-size: 10px; padding: 1px 5px; border: 1px solid var(--border-2); border-radius: 4px; color: var(--muted); background: var(--bg-1); }
.app .link { color: var(--accent-text); font-weight: 600; text-decoration: none; }

/* title bar */
.titlebar { display: flex; align-items: center; gap: 2px; padding-left: 12px; background: var(--titlebar-bg); border-bottom: 1px solid var(--border); position: relative; }
.titlebar .logo { width: 18px; height: 18px; margin-right: 10px; }
.titlebar .menu { display: flex; color: var(--text-2); font-size: var(--fs-md); }
.titlebar .menu span { padding: 4px 8px; border-radius: var(--r-1); }
.titlebar .cmd { position: absolute; left: 50%; transform: translateX(-50%); width: 440px; height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px;
  border: 1px solid var(--border-2); border-radius: var(--r-2); background: var(--bg-3); color: var(--faint); font-size: var(--fs-sm); }
.titlebar .cmd .ws { color: var(--text-2); font-weight: 500; }
.titlebar .cmd .kbd { margin-left: auto; }
.titlebar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: var(--fs-sm); }
.titlebar .okdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
.titlebar .winctl { display: flex; margin-left: 6px; }
.titlebar .winctl span { width: 46px; height: var(--title-h); display: grid; place-items: center; color: var(--text-2); }

/* body */
.body { display: grid; grid-template-columns: var(--act-w) var(--side-w) minmax(0, 1fr) var(--insp-w); min-height: 0; }
.activity { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: var(--activity-bg); border-right: 1px solid var(--border); }
.activity .act { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r-2); color: var(--faint); position: relative; }
.activity .act svg.i { width: 20px; height: 20px; stroke-width: 1.5; }
.activity .act.on { color: var(--text); }
.activity .act .bdg { position: absolute; right: 2px; top: 3px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--mk-error); color: #fff; font: 600 9.5px/15px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px var(--activity-bg); }
.activity .sp { flex: 1; }
.side { background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
.side .sh { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; }
.st { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.side .path { padding: 0 16px 8px; color: var(--faint); font: var(--fs-xs) var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .src { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 16px; font-size: var(--fs-md); color: var(--text-2); }
.side .src .sw { width: 3px; height: 16px; border-radius: 2px; background: var(--c); flex: none; }
.side .src .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .src .fmt { font: 10px var(--font-mono); color: var(--muted); padding: 1px 5px; border-radius: 4px; background: var(--bg-active); }
.side .src .n { font: var(--fs-xs) var(--font-mono); color: var(--muted); width: 32px; text-align: right; }
.side .src.sel { background: var(--bg-active); color: var(--text); }
.side .coll { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-top: 1px solid var(--border); color: var(--muted); }
.side .coll .cnt { margin-left: auto; font: var(--fs-xs) var(--font-mono); color: var(--faint); }
.side .grow { flex: 1; }
.side .prof { margin: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-3); font-size: var(--fs-sm); color: var(--muted); }
.side .prof b { color: var(--text-2); font-weight: 600; display: block; }

.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-1); }
.filterbar { display: flex; align-items: center; gap: 8px; height: var(--filter-h); padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--bg-1); flex: none; }
.filterbar .search { flex: 1 1 auto; min-width: 130px; max-width: 280px; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 9px; border: 1px solid var(--border-2); border-radius: var(--r-2); background: var(--bg-3); color: var(--faint); font-size: var(--fs-sm); }
.filterbar .search .ph { flex: 1; white-space: nowrap; overflow: hidden; }
.filterbar .tog { font: 10px var(--font-mono); padding: 2px 4px; border-radius: 3px; color: var(--muted); }
.levels { display: flex; height: 28px; border: 1px solid var(--border-2); border-radius: var(--r-2); overflow: hidden; flex: none; }
.lv { display: flex; align-items: center; gap: 5px; padding: 0 7px; font: 500 11px var(--font-mono); color: var(--text-2); border-right: 1px solid var(--border); background: var(--bg-3); }
.lv:last-child { border-right: 0; }
.lv .n { color: var(--muted); font-weight: 400; }
.lv.off { color: var(--faint); background: transparent; }
.lv.off .n { color: var(--faint); }
.lv svg { width: 9px; height: 9px; }
.fctl { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--border-2); border-radius: var(--r-2); font-size: var(--fs-sm); color: var(--text-2); white-space: nowrap; flex: none; background: var(--bg-3); }
.fctl .k { color: var(--muted); }
.fctl.dash { border-style: dashed; background: transparent; color: var(--muted); }
.fctl.plain { border-color: transparent; background: transparent; color: var(--text-2); }
.filterbar .sp { flex: 1; }

.panel { background: var(--bg-1); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.ptabs { height: var(--tab-h); display: flex; align-items: stretch; background: var(--tabs-bg); border-bottom: 1px solid var(--border); flex: none; }
.ptab { display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--muted); font-size: var(--fs-md); }
.ptab.on { color: var(--text); background: var(--bg-1); }
.pacts { margin-left: auto; display: flex; align-items: center; gap: 2px; padding-right: 6px; }
.pacts .ib { width: 24px; height: 24px; }
.tl-head { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; flex: none; }
.tl-head .ttl { font-weight: 600; font-size: var(--fs-md); white-space: nowrap; }
.tl-head .meta { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
.tl-head .tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.find { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-2); white-space: nowrap; min-width: 0; }
.legend { display: flex; align-items: center; gap: 16px; height: 26px; padding: 0 12px; font-size: var(--fs-xs); color: var(--text-2); flex: none; white-space: nowrap; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.legend .k .c { font-family: var(--font-mono); color: var(--muted); }
.legend .more { color: var(--accent-text); font-weight: 600; }
.legend .lsep { width: 1px; height: 14px; background: var(--border-2); }
.tl-plot { position: relative; flex: none; }
.tl-plot svg { display: block; }
.tl-plot text { font-family: var(--font-sans); }
.tl-plot .mono { font-family: var(--font-mono); }

.grid-h { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px; flex: none; font-size: var(--fs-sm); }
.grid-h .ttl { font-weight: 600; font-size: var(--fs-md); }
.grid-h .r { margin-left: auto; display: flex; gap: 4px; align-items: center; color: var(--muted); }
.g-cols, .g-row { display: grid; grid-template-columns: 14px 104px 64px 214px minmax(0, 1fr); align-items: center; padding-right: 12px; }
.g-cols { height: 26px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--muted); font-size: var(--fs-xs); font-weight: 600; flex: none; background: var(--bg-1); }
.g-cols span:nth-child(2) { padding-left: 0; }
.g-body { overflow: hidden; min-height: 0; flex: 1; }
.g-row { height: var(--row-h); font-size: var(--fs-sm); position: relative; color: var(--text-2); border-bottom: 1px solid var(--row-line); }
.g-row > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
.g-row .stripe { align-self: stretch; padding: 0; margin: 3px 0 3px 4px; width: 3px; border-radius: 2px; background: var(--c); }
.g-row .t { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); }
.g-row .inst { color: var(--text-2); }
.g-row .msg { color: var(--text); }
.g-row.sel { background: var(--bg-sel); }
.g-row.kb { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
.lvc { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px var(--font-mono); color: var(--lt); letter-spacing: .02em; }
.lvc svg { width: 9px; height: 9px; flex: none; }
.L-DBG { --lt: var(--muted); --lf: var(--lvl-debug); }
.L-INF { --lt: var(--muted); --lf: var(--lvl-info); }
.L-WRN { --lt: var(--warn-text); --lf: var(--lvl-warn); }
.L-ERR { --lt: var(--danger-text); --lf: var(--lvl-error); }
.L-FTL { --lt: var(--fatal-text); --lf: var(--lvl-fatal); }

.insp { background: var(--bg-1); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow-drawer); position: relative; z-index: 2; }
.insp .ptabs { background: var(--bg-1); }
.insp-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.ev-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lvb { font: 600 11px var(--font-sans); padding: 2px 8px; border-radius: 10px; color: var(--lt); background: color-mix(in srgb, var(--lf) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lf) 45%, transparent); display: inline-flex; gap: 5px; align-items: center; }
.lvb svg { width: 10px; height: 10px; }
.ev-time { font-family: var(--font-mono); font-size: var(--fs-lg); color: var(--text); font-weight: 500; }
.ev-msg { font-size: var(--fs-lg); font-weight: 600; color: var(--text); line-height: 1.35; }
.ev-inst { white-space: nowrap; display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: var(--fs-sm); }
.ev-inst .sw { width: 3px; height: 14px; border-radius: 2px; background: var(--c); }
.ev-sec { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.stack { margin: 0; font: 11px/1.65 var(--font-mono); background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--r-2); padding: 8px 10px; white-space: pre; overflow: hidden; color: var(--text-2); }
.stack b { color: var(--danger-text); font-weight: 500; }
.kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); margin: 0; font-size: var(--fs-sm); }
.kv dt { color: var(--muted); padding: 4px 0; border-bottom: 1px solid var(--row-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv dd { margin: 0; padding: 4px 0; font-family: var(--font-mono); font-size: 11.5px; color: var(--text); border-bottom: 1px solid var(--row-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insp-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.status { display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--statusbar-bg); color: var(--statusbar-text); border-top: 1px solid var(--border); font-size: var(--fs-xs); white-space: nowrap; }
.status .r { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.status b { font-weight: 600; color: var(--statusbar-strong); }
.status .wf { display: inline-flex; align-items: center; gap: 5px; }

/* timeline overlays */
.tip { position: absolute; z-index: 5; width: 300px; background: var(--tooltip-bg); border: 1px solid var(--border-3); border-radius: var(--r-3); box-shadow: var(--shadow-pop); font-size: var(--fs-sm); color: var(--text-2); overflow: hidden; }
.tip .th { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
.tip .th b { color: var(--text); font-size: var(--fs-md); }
.tip .th .tm { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.tip .tb { padding: 0 12px 10px; display: grid; gap: 3px; }
.tip .tq { color: var(--text); font-weight: 500; }
.tip .tf { display: flex; gap: 12px; padding: 7px 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: var(--fs-xs); background: var(--bg-2); }
.readout { position: absolute; z-index: 4; transform: translateX(-50%); font: 500 10.5px var(--font-mono); padding: 2px 6px; border-radius: 3px; background: var(--readout-bg); color: var(--readout-text); white-space: nowrap; }
.bpill { position: absolute; z-index: 4; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: var(--fs-xs); }

/* ── Direction 1 · Calm IDE ── */
.d-calm .activity .act.on::before { content: ''; position: absolute; left: -4px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--accent); }
.d-calm .ptab.on { box-shadow: inset 0 -2px 0 var(--accent); }
.d-calm .ptabs { background: var(--bg-1); }
.d-calm .find svg.wi { color: var(--warn-text); }
.d-calm .find b { color: var(--text); font-weight: 600; }
.d-calm .find .dot { color: var(--faint); }
.d-calm .selsum { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-2); padding: 0 4px 0 10px; height: 26px; border-radius: var(--r-2); background: var(--accent-soft); white-space: nowrap; }
.d-calm .selsum .mono { color: var(--text); }
.d-calm .bpill { display: none; }
.d-calm .g-row { --row-line: transparent; }
.d-calm .g-row.L-FTL { background: color-mix(in srgb, var(--lvl-fatal) 7%, transparent); }
.d-calm .g-row.L-FTL.sel { background: var(--bg-sel); }

/* ── Direction 2 · Observability console ── */
.d-obs .body { gap: 8px; padding: 0 8px 8px 0; background: var(--bg-0); }
.d-obs .activity { border-right: 0; background: var(--bg-0); }
.d-obs .activity .act.on { background: var(--accent-soft); color: var(--accent-text); }

function renderTimeline(dk, o) {
  const D = DIRS[dk], k = o.large ? 1.22 : 1, u = 'u' + (++UID);
  const laneH = Math.round(D.laneH * k), labelW = Math.round(D.labelW * (o.large ? 1.12 : 1));
  const padR = 24, plotX = labelW, plotW = o.W - labelW - padR;
  const X = m => plotX + m / SPAN * plotW;
  const histTop = Math.round(D.topPad * k), histH = Math.round(D.histH * k);
  const axisY = histTop + histH + 3;
  const lanesTop = axisY + Math.round(D.axisH * k);
  const H = lanesTop + LANES.length * laneH + 8 + (dk === 'prec' ? 14 : 0);
  const fsLab = o.large ? 13 : 12, fsSub = o.large ? 12 : 11, fsAx = o.large ? 11 : 10.5;
  const mk = D.mk * (o.large ? 1.2 : 1);
  const s = [], ov = [];
  // defs
  s.push(`<defs>`);
  s.push(`<pattern id="${u}h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--silent-hatch);stroke-width:2"/></pattern>`);
  for (let i = 1; i <= 6; i++) s.push(`<linearGradient id="${u}g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--src-${i});stop-opacity:.55"/><stop offset="1" style="stop-color:var(--src-${i});stop-opacity:.05"/></linearGradient>`);
  s.push(`<linearGradient id="${u}inc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--mk-fatal);stop-opacity:0"/><stop offset=".5" style="stop-color:var(--mk-fatal);stop-opacity:.16"/><stop offset="1" style="stop-color:var(--mk-fatal);stop-opacity:0"/></linearGradient>`);
  s.push(`<linearGradient id="${u}hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.22"/></linearGradient>`);
  s.push(`</defs>`);

  // lane backgrounds + hover
  LANES.forEach((L, i) => {
    const y = lanesTop + i * laneH;
    const hovered = o.hover && L.id === HOVER.lane;
    if (dk === 'calm') {
      if (hovered) s.push(`<rect x="0" y="${y}" width="${o.W}" height="${laneH}" style="fill:var(--bg-hover)"/>`);
      else if (i % 2 === 1) s.push(`<rect x="0" y="${y}" width="${o.W}" height="${laneH}" style="fill:var(--lane-bar)"/>`);
    } else if (dk === 'obs') {
      s.push(`<rect x="${plotX - 4}" y="${y + 2}" width="${plotW + 8}" height="${laneH - 4}" rx="7" style="fill:${hovered ? 'var(--bg-hover)' : 'var(--lane-bar)'}"/>`);
      if (hovered) s.push(`<rect x="4" y="${y + 2}" width="${o.W - 8}" height="${laneH - 4}" rx="7" style="fill:none;stroke:var(--border-3)"/>`);
    } else {
      if (hovered) s.push(`<rect x="0" y="${y}" width="${o.W}" height="${laneH}" style="fill:var(--bg-hover)"/>`);
      s.push(`<line x1="8" x2="${o.W - padR}" y1="${y + laneH - .5}" y2="${y + laneH - .5}" style="stroke:var(--grid-line)"/>`);
    }
  });
  // vertical grid
  for (let m = 0; m <= SPAN; m += 15) {
    const x = Math.round(X(m)) + .5;
    const major = m % 60 === 0;
    if (dk === 'prec') s.push(`<line x1="${x}" x2="${x}" y1="${histTop}" y2="${H - 6}" style="stroke:var(--grid-line)${major ? '' : ';stroke-dasharray:1 3'}"/>`);
    else s.push(`<line x1="${x}" x2="${x}" y1="${lanesTop}" y2="${H - 6}" style="stroke:var(--grid-line)"/>`);
  }
  // incident band (obs): meaning = proximity to a crash
  if (D.crashLine === 'band') {
    [[101.4], [179.95]].forEach(([m]) => { const w = 34 * k; s.push(`<rect x="${X(m) - w / 2}" y="${histTop}" width="${w}" height="${H - 6 - histTop}" fill="url(#${u}inc)"/>`); });
  }

  // histogram
  const nb = Math.floor(plotW / (D.histBar + D.histGap)), bw = plotW / nb;
  const HB = [];
  let hmax = 0;
  for (let b = 0; b < nb; b++) {
    const a = Math.floor(b * N / nb), z = Math.floor((b + 1) * N / nb);
    let t = 0, w = 0, e = 0;
    for (const L of LANES) for (let i = a; i < z; i++) { t += L.c[i]; w += L.w[i]; e += L.e[i]; }
    HB.push([t, w, e]); hmax = Math.max(hmax, t);
  }
  const hb = histTop + histH;
  HB.forEach(([t, w, e], b) => {
    const x = plotX + b * bw, bwid = D.histBar;
    const ht = t / hmax * histH;
    let he = e >= .8 ? Math.max(e / hmax * histH, 1.5) : 0, hw = w >= 2 ? Math.max(w / hmax * histH, 1) : 0;
    const hi = Math.max(0, ht - he - hw);
    const gap = dk === 'prec' ? 0 : 1;
    let y = hb;
    if (dk === 'obs') {
      const r = Math.min(1.5, bwid / 2);
      s.push(`<rect x="${f1(x)}" y="${f1(hb - ht)}" width="${bwid}" height="${f1(ht)}" rx="${r}" style="fill:var(--hist-info)"/>`);
      if (hw) s.push(`<rect x="${f1(x)}" y="${f1(hb - he - hw - (he ? gap : 0) - (hi > 0 ? 0 : 0))}" width="${bwid}" height="${f1(hw)}" style="fill:var(--lvl-warn)"/>`);
      if (he) s.push(`<rect x="${f1(x)}" y="${f1(hb - he)}" width="${bwid}" height="${f1(he)}" style="fill:var(--lvl-error)"/>`);
    } else {
      if (he) { s.push(`<rect x="${f1(x)}" y="${f1(y - he)}" width="${bwid}" height="${f1(he)}" style="fill:var(--lvl-error)"/>`); y -= he + gap; }
      if (hw) { s.push(`<rect x="${f1(x)}" y="${f1(y - hw)}" width="${bwid}" height="${f1(hw)}" style="fill:var(--lvl-warn)"/>`); y -= hw + gap; }
      if (hi > 0.3) s.push(`<rect x="${f1(x)}" y="${f1(y - hi)}" width="${bwid}" height="${f1(hi)}" style="fill:var(--hist-info)"/>`);
    }
  });
  // histogram baseline + label column
  s.push(`<line x1="${plotX}" x2="${plotX + plotW}" y1="${hb + .5}" y2="${hb + .5}" style="stroke:var(--border-2)"/>`);
  const perBucket = Math.round(SPAN * 60 / nb);
  if (dk === 'calm') {
    s.push(`<text x="16" y="${histTop + 13}" style="fill:var(--text-2);font-size:${fsSub}px;font-weight:600">Events</text>`);
    s.push(`<text x="16" y="${histTop + 28}" style="fill:var(--muted);font-size:${fsSub}px">per ${perBucket} s · max ${Math.round(hmax)}</text>`);
  } else if (dk === 'obs') {
    s.push(`<text x="16" y="${histTop + 14}" style="fill:var(--text);font-size:${fsLab}px;font-weight:600">Volume</text>`);
    s.push(`<text x="16" y="${histTop + 30}" style="fill:var(--muted);font-size:${fsSub}px">${perBucket} s buckets</text>`);
    const ly = histTop + 48 * k; let lx = 16;
    [['hist-info', 'Info'], ['lvl-warn', 'Warn'], ['lvl-error', 'Error']].forEach(([c, t]) => { s.push(`<rect x="${lx}" y="${ly - 7}" width="8" height="8" rx="2" style="fill:var(--${c})"/><text x="${lx + 12}" y="${ly}" style="fill:var(--text-2);font-size:${fsSub}px">${t}</text>`); lx += t.length * 6.5 + 26; });
  } else {
    s.push(`<text x="16" y="${histTop + 10}" style="fill:var(--muted);font-size:10px;letter-spacing:.08em;font-weight:600">EVENTS / ${perBucket} s</text>`);
    [[hmax, 0], [hmax / 2, .5], [0, 1]].forEach(([v, f]) => {
      const yy = histTop + f * histH;
      s.push(`<text class="mono" x="${plotX - 8}" y="${yy + 3.5}" text-anchor="end" style="fill:var(--faint);font-size:10px">${Math.round(v)}</text>`);
      s.push(`<line x1="${plotX - 4}" x2="${plotX}" y1="${yy + .5}" y2="${yy + .5}" style="stroke:var(--border-3)"/>`);
    });
  }

  // axis
  const axY = axisY + Math.round(D.axisH * k) - 7;
  const labStep = plotW / SPAN * 15 < 56 ? 30 : 15;
  for (let m = 0; m <= SPAN; m += 5) {
    const x = Math.round(X(m)) + .5;
    const maj = m % 15 === 0;
    if (dk === 'prec') s.push(`<line x1="${x}" x2="${x}" y1="${hb}" y2="${hb + (maj ? 5 : 3)}" style="stroke:var(--${maj ? 'text-2' : 'border-3'})"/>`);
    else if (maj) s.push(`<line x1="${x}" x2="${x}" y1="${hb}" y2="${hb + 4}" style="stroke:var(--border-3)"/>`);
    if (maj && m % labStep === 0) {
      const anchor = m === 0 ? 'start' : m === SPAN ? 'end' : 'middle';
      const label = hhmm(m);
      s.push(`<text class="mono" x="${x}" y="${axY}" text-anchor="${anchor}" style="fill:var(--${m % 60 === 0 ? 'text-2' : 'muted'});font-size:${fsAx}px${m % 60 === 0 && dk !== 'calm' ? ';font-weight:600' : ''}">${label}</text>`);
    }
  }

  if (dk === 'prec') {
    s.push(`<text x="16" y="${histTop + 24}" style="fill:var(--faint);font-size:10px;letter-spacing:.06em">WED 14 OCT 2026 · UTC</text>`);
    [['LANE', 22, 'start'], ['PID', labelW - 96, 'end'], ['EVENTS', labelW - 46, 'end'], ['ERR', labelW - 14, 'end']].forEach(([t, x, a]) => s.push(`<text x="${x}" y="${axY}" text-anchor="${a}" style="fill:var(--muted);font-size:9.5px;letter-spacing:.08em;font-weight:600">${t}</text>`));
  } else s.push(`<text x="16" y="${axY}" style="fill:var(--muted);font-size:${fsAx}px">Wed 14 Oct · UTC</text>`);
  // lanes
  const lb = D.laneBucket, nl = Math.floor(plotW / lb), lbw = plotW / nl;
  let gmax = 0;
  const LB = LANES.map(L => { const arr = new Float64Array(nl); for (let b = 0; b < nl; b++) { const a = Math.floor(b * N / nl), z = Math.floor((b + 1) * N / nl); let t = 0; for (let i = a; i < z; i++) t += L.c[i]; arr[b] = t; if (!L.sparse) gmax = Math.max(gmax, t); } return arr; });
  LANES.forEach((L, i) => {
    const y = lanesTop + i * laneH, mid = y + laneH / 2, src = L.src + 1, cvar = `var(--src-${src})`;
    // label column
    if (dk === 'calm') {
      s.push(`<rect x="10" y="${y + 7}" width="3" height="${laneH - 14}" rx="1.5" style="fill:${cvar}"/>`);
      s.push(`<text x="21" y="${mid - 2}" style="font-size:${fsLab}px;fill:var(--text)"><tspan style="font-weight:600">${esc(L.app)}</tspan><tspan style="fill:var(--muted)"> · ${L.inst}</tspan></text>`);
      s.push(`<text x="21" y="${mid + 11.5}" style="font-size:${fsSub}px;fill:var(--muted)"><tspan class="mono" style="font-size:${fsSub - .5}px">${L.pid}</tspan> · ${L.total.toLocaleString('en-US')} events${L.err ? ` · <tspan style="fill:var(--danger-text)">${L.err} err</tspan>` : ''}</text>`);
    } else if (dk === 'obs') {
      s.push(`<circle cx="18" cy="${mid - 6}" r="4" style="fill:${cvar}"/>`);
      s.push(`<text x="28" y="${mid - 2}" style="font-size:${fsLab}px;fill:var(--text);font-weight:600">${esc(L.app)} <tspan style="font-weight:500;fill:var(--text-2)">${L.inst}</tspan></text>`);
      s.push(`<text x="28" y="${mid + 11}" style="font-size:${fsSub}px;fill:var(--muted)"><tspan class="mono">${L.pid}</tspan> · ${L.total.toLocaleString('en-US')}${L.err ? ` · <tspan style="fill:var(--danger-text);font-weight:600">${L.err} errors</tspan>` : ''}</text>`);
    } else {
      s.push(`<rect x="10" y="${mid - 3}" width="6" height="6" style="fill:${cvar}"/>`);
      s.push(`<text x="22" y="${mid + 4}" style="font-size:${fsLab}px;fill:var(--text)"><tspan style="font-weight:500">${esc(L.app)}</tspan><tspan style="fill:var(--muted)"> ${L.inst}</tspan></text>`);
      s.push(`<text class="mono" x="${labelW - 96}" y="${mid + 4}" text-anchor="end" style="font-size:${fsSub - .5}px;fill:var(--faint)">${L.pid}</text>`);
      s.push(`<text class="mono" x="${labelW - 46}" y="${mid + 4}" text-anchor="end" style="font-size:${fsSub - .5}px;fill:var(--text-2)">${L.total.toLocaleString('en-US')}</text>`);
      s.push(`<text class="mono" x="${labelW - 14}" y="${mid + 4}" text-anchor="end" style="font-size:${fsSub - .5}px;fill:var(--${L.err ? 'danger-text' : 'faint'})">${L.err || '–'}</text>`);
    }
    // runs (behind density)
    L.runs.forEach(([a, b, end]) => {
      const x1 = X(a), x2 = X(b);
      if (D.run === 'pill') {
        const partial = !(a === 0 && b >= 179);
        s.push(`<rect x="${f1(x1)}" y="${y + 4}" width="${f1(x2 - x1)}" height="${laneH - 8}" rx="6" style="fill:${cvar};fill-opacity:.10;stroke:${cvar};stroke-opacity:.38"/>`);
        if (o.large && partial && x2 - x1 > 70) s.push(`<text x="${f1(x1 + 7)}" y="${y + 15 * k}" style="font-size:${10 * k}px;fill:var(--text-2);font-weight:500">${end === 'crash' ? 'Run ' + Math.round(b - a) + ' m · ended by crash' : end === 'silent' ? 'Run · silent after ' + Math.round(b - a) + ' m' : 'Run ' + Math.round(b - a) + ' m'}</text>`);
      } else if (D.run === 'line') {
        const ry = y + laneH - 4.5;
        s.push(`<line x1="${f1(x1 + 1)}" x2="${f1(x2 - 1)}" y1="${ry}" y2="${ry}" style="stroke:${cvar};stroke-width:2;stroke-linecap:round;stroke-opacity:${a === 0 && b >= 179 ? .55 : .9}"/>`);
      } else {
        const ry = y + laneH - 3.5;
        s.push(`<path d="M${f1(x1)} ${ry - 3}V${ry}H${f1(x2)}V${ry - 3}" style="fill:none;stroke:var(--run);stroke-width:1"/>`);
      }
    });
    // went silent
    if (L.silent) {
      const x1 = X(L.silent), x2 = X(SPAN);
      const yy = dk === 'obs' ? y + 4 : y + 3, hh = dk === 'obs' ? laneH - 8 : laneH - 6;
      s.push(`<rect x="${f1(x1)}" y="${yy}" width="${f1(x2 - x1)}" height="${hh}" rx="${dk === 'obs' ? 6 : dk === 'calm' ? 3 : 0}" fill="url(#${u}h)" style="stroke:var(--silent-hatch);stroke-dasharray:${dk === 'prec' ? '0' : '3 3'}"/>`);
      const lbl = dk === 'prec' ? 'SILENT 47m' : 'Went silent · 47 m';
      const tw = lbl.length * (dk === 'prec' ? 6.3 : 5.9) * (o.large ? 1.1 : 1) + 12;
      s.push(`<rect x="${f1(x1 + 6)}" y="${mid - 8 * k}" width="${f1(tw)}" height="${f1(16 * k)}" rx="${dk === 'prec' ? 0 : 8 * k}" style="fill:var(--bg-1);stroke:var(--${dk === 'obs' ? 'mk-warning' : 'border-2'})"/>`);
      s.push(`<text ${dk === 'prec' ? 'class="mono"' : ''} x="${f1(x1 + 12)}" y="${f1(mid + 3.5 * k)}" style="font-size:${fsSub - (dk === 'prec' ? 1 : 0)}px;fill:var(--${dk === 'obs' ? 'warn-text' : 'text-2'});font-weight:${dk === 'obs' ? 600 : 500}">${lbl}</text>`);
    }
    // density
    const arr = LB[i];
    if (L.sparse) {
      L.ticks.forEach(m => {
        const x = X(m);
        if (dk === 'obs') s.push(`<circle cx="${f1(x)}" cy="${mid + 2}" r="${2.2 * k}" style="fill:${cvar}"/>`);
        else s.push(`<line x1="${f1(x)}" x2="${f1(x)}" y1="${mid - 4 * k}" y2="${mid + 5 * k}" style="stroke:var(--${dk === 'calm' ? 'muted' : 'density'});stroke-width:${dk === 'calm' ? 1.5 : 1}"/>`);
      });
    } else {
      const base = dk === 'calm' ? y + laneH - 8 : dk === 'obs' ? y + laneH - 5 : y + laneH - 4.5;
      const maxH = dk === 'calm' ? laneH - 13 : dk === 'obs' ? (o.large ? laneH - 22 : laneH - 11) : laneH - 8;
      if (D.density === 'barcode') {
        let d = '';
        for (let b = 0; b < nl; b++) if (arr[b] > 0.2) { const h = Math.max(1, Math.sqrt(arr[b] / gmax) * maxH); const x = Math.round(plotX + b * lbw) + .5; d += `M${x} ${base}v${-f1(h)}`; }
        s.push(`<path d="${d}" style="stroke:var(--density);stroke-width:1;opacity:.82"/>`);
      } else {
        // area, split into contiguous segments
        let seg = [], segs = [];
        for (let b = 0; b < nl; b++) {
          if (arr[b] > 0.05) seg.push([plotX + (b + .5) * lbw, base - Math.max(1.2, Math.sqrt(arr[b] / gmax) * maxH)]);
          else if (seg.length) { segs.push(seg); seg = []; }
        }
        if (seg.length) segs.push(seg);
        segs.forEach(sg => {
          const x0 = sg[0][0] - lbw / 2, x1 = sg[sg.length - 1][0] + lbw / 2;
          const pts = sg.map(([x, yy]) => `L${f1(x)} ${f1(yy)}`).join('');
          const top = `M${f1(x0)} ${f1(sg[0][1])}${pts}L${f1(x1)} ${f1(sg[sg.length - 1][1])}`;
          if (dk === 'calm') s.push(`<path d="M${f1(x0)} ${base}L${f1(x0)} ${f1(sg[0][1])}${pts}L${f1(x1)} ${f1(sg[sg.length - 1][1])}L${f1(x1)} ${base}Z" style="fill:var(--density)"/>`);
          else { s.push(`<path d="M${f1(x0)} ${base}L${f1(x0)} ${f1(sg[0][1])}${pts}L${f1(x1)} ${f1(sg[sg.length - 1][1])}L${f1(x1)} ${base}Z" fill="url(#${u}g${src})"/>`); s.push(`<path d="${top}" style="fill:none;stroke:${cvar};stroke-width:1.25;stroke-linejoin:round"/>`); }
        });
      }
    }
  });

  // crash lines (calm dashed / prec solid)
  if (D.crashLine !== 'band') {
    [101.4, 179.95].forEach(m => {
      const x = Math.round(X(m)) + .5;
      s.push(`<line x1="${x}" x2="${x}" y1="${dk === 'prec' ? histTop : lanesTop}" y2="${H - (dk === 'prec' ? 18 : 6)}" style="stroke:var(--mk-fatal);stroke-opacity:${dk === 'prec' ? .75 : .45};${dk === 'calm' ? 'stroke-dasharray:3 3' : ''}"/>`);
      if (dk === 'prec') s.push(`<text class="mono" x="${x - 4}" y="${H - 6}" text-anchor="end" style="font-size:10px;fill:var(--fatal-text);font-weight:600">CRASH ${m > 179 ? '11:59:57' : '10:41:24'}</text>`);
    });
  }

  // brush (behind markers so markers stay legible)
  const bx1 = X(BRUSH[0]), bx2 = X(BRUSH[1]);
  if (dk === 'prec') {
    [[histTop, hb], [lanesTop, H - 20]].forEach(([y1, y2]) => {
      s.push(`<rect x="${plotX}" y="${y1}" width="${f1(bx1 - plotX)}" height="${y2 - y1}" style="fill:var(--brush-fill)"/>`);
      s.push(`<rect x="${f1(bx2)}" y="${y1}" width="${f1(plotX + plotW - bx2)}" height="${y2 - y1}" style="fill:var(--brush-fill)"/>`);
    });
  } else {
    s.push(`<rect x="${f1(bx1)}" y="${histTop}" width="${f1(bx2 - bx1)}" height="${H - 6 - histTop}" style="fill:var(--brush-fill)"/>`);
  }
  [bx1, bx2].forEach(x => s.push(`<line x1="${f1(x)}" x2="${f1(x)}" y1="${histTop}" y2="${H - (dk === 'prec' ? 20 : 6)}" style="stroke:var(--brush-edge);stroke-width:1"/>`));
  if (dk !== 'prec') [bx1, bx2].forEach(x => s.push(`<rect x="${f1(x - 3)}" y="${f1(histTop + histH / 2 - 9)}" width="6" height="18" rx="3" style="fill:var(--bg-1);stroke:var(--brush-edge);stroke-width:1.25"/>`));
  else {
    const by = 8;
    s.push(`<path d="M${f1(bx1)} ${by + 6}V${by}H${f1(bx2)}V${by + 6}" style="fill:none;stroke:var(--brush-edge)"/>`);
  }

  // markers, clustered so none overlap (cluster keeps the most important kind and sums counts)
  const minGap = mk + 3, badges = [];
  LANES.forEach((L, i) => {
    const y = lanesTop + i * laneH, cy = dk === 'prec' ? y + laneH / 2 : y + laneH / 2 + (dk === 'obs' ? 1 : -1.5);
    const list = MARKS.filter(m => m[0] === L.id).map(m => ({ kind: m[1], m: m[2], n: m[3], x: X(m[2]) })).sort((a, b) => a.x - b.x);
    const out = [];
    list.forEach(it => { const last = out[out.length - 1]; if (last && it.x - last.x < minGap) { last.n += it.n; if (RANK[it.kind] > RANK[last.kind]) { last.kind = it.kind; last.x = it.x; last.m = it.m; } } else out.push({ ...it }); });
    out.sort((a, b) => RANK[a.kind] - RANK[b.kind]);
    out.forEach(it => {
      const sz = it.kind === 'crash' ? mk * 1.35 : mk;
      const isSel = o.selected && L.id === 'web02a' && it.kind === 'crash';
      if (it.kind === 'crash' && dk === 'obs') s.push(`<circle class="halo" cx="${f1(it.x)}" cy="${f1(cy)}" r="7" style="fill:none;stroke:var(--mk-fatal);stroke-width:2"/>`);
      if (isSel) s.push(`<circle cx="${f1(it.x)}" cy="${f1(cy)}" r="${f1(sz * .82)}" style="fill:none;stroke:var(--focus-ring);stroke-width:2"/>`);
      s.push(glyph(it.kind, it.x, cy, sz, D.ringW * (o.large ? 1.2 : 1)));
      if (it.n > 1) {
        const t = String(it.n), bw0 = dk === 'obs' ? t.length * 6 + 8 : t.length * 6, flip = it.x + sz * .45 + bw0 > o.W - 2, bxp = flip ? it.x - sz * .45 - bw0 - 1 : it.x + sz * .45, byp = cy - sz * .5;

    <div class="scale-row"><code>mono numerals</code><span style="font-family:${C['font-mono'].replace(/"/g, '&quot;')};font-size:12px">10:41:24.318 · 17,559 · 0O1lI</span></div></div>
   <div class="tok"><div class="h3" style="margin-top:0">Spacing (4/8 scale)</div>${['s-1', 's-2', 's-3', 's-4', 's-5', 's-6'].map(k => `<div class="scale-row"><code>--${k} ${C[k]}</code><span class="spbar" style="width:${C[k]}"></span></div>`).join('')}</div>
   <div class="tok"><div class="h3" style="margin-top:0">Radius · size · motion</div>
    ${['r-1', 'r-2', 'r-3'].map(k => `<div class="scale-row"><code>--${k} ${C[k]}</code><span style="display:inline-block;width:40px;height:20px;border:1.5px solid var(--pg-muted);border-radius:${C[k]}"></span></div>`).join('')}
    ${['title-h', 'filter-h', 'tab-h', 'row-h', 'status-h'].map(k => `<div class="scale-row"><code>--${k}</code><span>${C[k]}</span></div>`).join('')}
    <div class="scale-row"><code>lane height</code><span>${D.laneH} px (close-up ${Math.round(D.laneH * 1.22)} px) · marker ${D.mk} px · ring ${D.ringW} px</span></div>
    ${['dur-fast', 'dur-med', 'dur-slow', 'ease'].map(k => `<div class="scale-row"><code>--${k}</code><span class="mono" style="font-family:'JetBrains Mono',monospace;font-size:12px">${C[k]}</span></div>`).join('')}</div>
  </div></div>`;
}

/* ═════════════════════════ Page assembly ═════════════════════════ */
const INTRO = {
  calm: { tag: 'A quiet, professional workbench where the data is the only thing with colour.', pts: ['<b>Neutral graphite surfaces</b>, one blue accent reserved for focus, selection and primary actions.', '<b>Crisp 1 px structure</b>: borders, not cards; zebra lanes; a 2 px accent underline marks the active tab.', '<b>Timeline</b>: soft neutral density areas, thin run lines in the source colour, shape-coded markers with a surface ring, dashed crash rules across lanes.', '<b>Findings</b> are one calm sentence in the timeline header; the brush summary sits in the toolbar, not over the data.'], who: 'Engineers who live in the app all day. Closest to today’s IMT, lowest risk.' },
  obs: { tag: 'A modern, colourful console where problems announce themselves.', pts: ['<b>Soft cards</b> on a tinted canvas (12 px radius, gentle elevation), violet accent.', '<b>Severity colour carries meaning</b>: findings as coloured chips, tinted error rows, level pills.', '<b>Timeline</b>: rounded lane tracks, density areas in each source’s colour with a vertical gradient (more volume, more ink), labelled run pills, pulsing halo on crashes and a red incident band whose gradient fades with distance from the crash.', '<b>Floating brush pill</b> with the selection summary and a Zoom action right on the chart.'], who: 'Support and operations users, demos and first-run delight. Most “wow”, most colour to govern.' },
  prec: { tag: 'An instrument for experts: maximum data, minimum ink.', pts: ['<b>Paper and ink</b>: near-black on warm white (and the inverse), one cobalt accent, 2 px radii.', '<b>Mono numerals everywhere</b> that matter (times, counts, line numbers, PIDs); small-caps section labels.', '<b>Timeline</b>: barcode density (one 1 px tick per bucket), histogram with a real y-scale, bracket runs, solid crash rules labelled on top, events and error counts as right-aligned columns per lane.', '<b>Brush dims the outside</b> rather than tinting the inside; tooltips are compact key/value tables.'], who: 'Power users comparing many instances on big screens. Densest (20 px rows, 22 px lanes), most austere.' }
};
const NOTES = {
  calm: [['Findings line', 'Warning glyph, bold counts, “Review” link. No banner, no colour block.'], ['Dense vs sparse', 'Scheduler (46 events) drops the area and draws one tick per event, so a quiet lane never looks empty.'], ['Selection & focus', 'Brush = 7–10% accent tint with handles; focused row has a 2 px focus ring; the selected crash marker gets an accent ring.']],
  obs: [['Findings chips', 'Each finding is a severity chip with its marker glyph, so colour is never the only cue.'], ['Meaningful gradients only', 'Density gradients encode volume; the incident band encodes nearness to a crash. Nothing else is gradient.'], ['Motion', 'Crash halo pulses once per 1.8 s and stops under prefers-reduced-motion.']],
  prec: [['Columns, not chips', 'Each lane carries right-aligned event and error counts so you can scan instances like a table.'], ['Real scales', 'Histogram y-ticks (0 / mid / max) and minor 5-minute ticks; crash rules are labelled with exact times.'], ['Density', '20 px grid rows and 22 px lanes fit ~2× the rows of Observability on the same screen.']]
};
function buildPanels() {
  const main = document.getElementById('panels');
  main.innerHTML = ['calm', 'obs', 'prec'].map((dk, i) => {
    const I = INTRO[dk];
    return `<section class="dpanel" id="p-${dk}" role="tabpanel" aria-labelledby="tab-${dk}" ${i ? 'hidden' : ''}>
      <div class="intro"><div><h2>${DIRS[dk].name}</h2><p>${I.tag}</p><ul>${I.pts.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div><p style="margin-top:34px"><b style="color:var(--pg-text)">Suits:</b> ${I.who}</p><p><b style="color:var(--pg-text)">Type:</b> ${esc(TOKENS[dk].common['font-sans'].split(',')[0].replace(/'/g, ''))} + ${esc(TOKENS[dk].common['font-mono'].split(',')[0].replace(/'/g, ''))}</p>
      <p><b style="color:var(--pg-text)">Source palette:</b><br>${[1, 2, 3, 4, 5, 6].map(n => `<span title="src-${n}" style="display:inline-block;width:26px;height:14px;border-radius:3px;margin:4px 4px 0 0;background:${TOKENS[dk].light['src-' + n]}"></span>`).join('')} light<br>${[1, 2, 3, 4, 5, 6].map(n => `<span title="src-${n}" style="display:inline-block;width:26px;height:14px;border-radius:3px;margin:4px 4px 0 0;background:${TOKENS[dk].dark['src-' + n]}"></span>`).join('')} dark</p></div></div>
      <div class="h3"><span>Main window · focused layout · 1440 × 900</span><span>event selected → inspector slid in · brush 10:36–10:52</span></div>
      <div class="stage" data-w="1440" data-h="900"><div class="frame theme-scope d-${dk}-scope">${mainWindow(dk)}</div></div>
      <div class="h3"><span>Timeline close-up · 1280 px</span><span>hover on the 10:41 crash · brush · dense and sparse lanes · legend</span></div>
      <div class="stage" data-w="1280" data-auto="1"><div class="frame theme-scope d-${dk}-scope">${closeUp(dk).html}</div></div>
      <div class="notes">${NOTES[dk].map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join('')}</div>
      <div class="h3"><span>Tokens</span><span>contrast ratios computed live (text ≥ 4.5:1 on bg-1/bg-2/bg-sel; graphics ≥ 3:1 on lanes)</span></div>
      ${tokenTable(dk)}
    </section>`;
  }).join('');
}
function themeCSS() {
  let css = '';
  for (const dk of Object.keys(TOKENS)) {
    const T = TOKENS[dk];
    const decl = o => Object.entries(o).map(([k, v]) => `--${k}:${v};`).join('');
    css += `.d-${dk}-scope{${decl(T.common)}}`;
    css += `[data-theme="dark"] .d-${dk}-scope{${decl(T.dark)}color-scheme:dark}`;
    css += `[data-theme="light"] .d-${dk}-scope{${decl(T.light)}color-scheme:light}`;
  }
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
}
function fit() {
  document.querySelectorAll('.dpanel:not([hidden]) .stage').forEach(st => {
    const fr = st.firstElementChild, w = +st.dataset.w;
    const sc = st.clientWidth / w;
    fr.style.transform = `scale(${sc})`;
    const h = st.dataset.auto ? fr.firstElementChild.offsetHeight : +st.dataset.h;
    st.style.height = Math.ceil(h * sc) + 'px';
  });
}
function setTheme(t) {
  document.body.setAttribute('data-theme', t);
  document.documentElement.setAttribute('data-page', t);
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === t)));
  try { localStorage.setItem('imt-dir-theme', t); } catch (e) { }
}
function setTab(dk) {
  document.querySelectorAll('.dtab').forEach(b => { const on = b.id === 'tab-' + dk; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll('.dpanel').forEach(p => p.hidden = p.id !== 'p-' + dk);
  fit();
  try { localStorage.setItem('imt-dir-tab', dk); } catch (e) { }
}
themeCSS(); buildPanels();
document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));
document.querySelectorAll('.dtab').forEach((b, i, all) => {
  b.addEventListener('click', () => setTab(b.id.slice(4)));
  b.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length]; n.focus(); setTab(n.id.slice(4)); } });
});
const q = new URLSearchParams(location.search);
let t0 = 'dark', d0 = 'calm';
try { t0 = localStorage.getItem('imt-dir-theme') || t0; d0 = localStorage.getItem('imt-dir-tab') || d0; } catch (e) { }
setTheme(q.get('theme') || t0); setTab(q.get('dir') || d0);
window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
</html>
