    <path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="none" stroke="url(#d0edge)" stroke-width="6"/>
    
  </g>
  <g filter="url(#d0gs)" transform="translate(512 512) scale(1) translate(-512 -512)"><g opacity="0.6"><path d="M300 340H600" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 684H552" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M300 512H426L480 424L568 604L620 512H724" fill="none" stroke="#FFFFFF" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/><path d="M668 340a46 46 0 1 1 92 0a46 46 0 1 1 -92 0Z" fill="#FFFFFF"/></g>
</svg><text class="name" x="132" y="68" style="font-size:28px">How Debrief works</text>
<circle class="accfill" cx="260" cy="188" r="44"/><g class="gl" transform="translate(242 170) scale(1.5)"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g><path class="conn" d="M318 188 L554 188"/><path class="chev" d="M548 182 l7 6 -7 6"/><text class="stepn" x="260" y="272" text-anchor="middle">STEP 1</text><text class="stept" x="260" y="302" text-anchor="middle">Open</text><text class="steps" x="260" y="330" text-anchor="middle">Logs, zips and diagnostic</text><text class="steps" x="260" y="358" text-anchor="middle">files, or a time range of</text><text class="steps" x="260" y="386" text-anchor="middle">a huge folder.</text>
<circle class="accfill" cx="620" cy="188" r="44"/><g class="gl" transform="translate(602 170) scale(1.5)"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></g><path class="conn" d="M678 188 L914 188"/><path class="chev" d="M908 182 l7 6 -7 6"/><text class="stepn" x="620" y="272" text-anchor="middle">STEP 2</text><text class="stept" x="620" y="302" text-anchor="middle">Search and filter</text><text class="steps" x="620" y="330" text-anchor="middle">Facets, lenses and a</text><text class="steps" x="620" y="358" text-anchor="middle">query language.</text>
<circle class="accfill" cx="980" cy="188" r="44"/><g class="gl" transform="translate(962 170) scale(1.5)"><path d="M3 12h4l2-6 4 12 2-6h6"/></g><path class="conn" d="M1038 188 L1274 188"/><path class="chev" d="M1268 182 l7 6 -7 6"/><text class="stepn" x="980" y="272" text-anchor="middle">STEP 3</text><text class="stept" x="980" y="302" text-anchor="middle">Analyse</text><text class="steps" x="980" y="330" text-anchor="middle">Anomalies, patterns,</text><text class="steps" x="980" y="358" text-anchor="middle">exceptions and error</text><text class="steps" x="980" y="386" text-anchor="middle">outliers.</text>
<circle class="accfill" cx="1340" cy="188" r="44"/><g class="gl" transform="translate(1322 170) scale(1.5)"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></g><text class="stepn" x="1340" y="272" text-anchor="middle">STEP 4</text><text class="stept" x="1340" y="302" text-anchor="middle">Share</text><text class="steps" x="1340" y="330" text-anchor="middle">Incident reports and</text><text class="steps" x="1340" y="358" text-anchor="middle">redacted copies.</text>
<line x1="80" x2="1520" y1="434" y2="434" stroke="var(--line)"/>
<text class="small" x="80" y="472">Pitcrew opens its job logs in Debrief. Sighter run bundles and Pitwall explanations are planned.</text>
</svg>