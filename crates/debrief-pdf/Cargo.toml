[package]
name = "debrief-pdf"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "PDF output for Debrief incident reports: selectable Unicode text (embedded font subsets) and charts embedded as vector graphics"

[dependencies]
debrief-core = { path = "../debrief-core" }
anyhow.workspace = true
miniz_oxide = "0.9"
# Pure-Rust PDF writing (MIT/Apache-2.0, from the typst project); svg2pdf turns the
# sanitised chart/timeline SVG into vector XObjects with selectable text.
pdf-writer = "0.12"
# Report text fonts (fonts/, SIL OFL 1.1): glyph lookup and metrics (skrifa, from Google's
# fontations; ttf-parser is unmaintained) and per-document subsetting (subsetter, from typst).
# Both MIT/Apache-2.0 and already in the graph through svg2pdf.
skrifa = { version = "0.42", default-features = false, features = ["std"] }
subsetter = "0.2.6"
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
# Same usvg as svg2pdf, plus the system fonts used for the SVGs' text.
usvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
