[package]
name = "debrief-plugin-tools"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Debrief tools plugin: Performance Monitor collector sets, the process monitor, the Event Log follower, the diagnostics collector and elevation info"

[dependencies]
debrief-core = { path = "../debrief-core" }
debrief-plugin-api = { path = "../debrief-plugin-api" }
debrief-monitor = { path = "../debrief-monitor" }
debrief-collect = { path = "../debrief-collect" }
debrief-plugin-windows = { path = "../debrief-plugin-windows" }
anyhow.workspace = true
chrono.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
