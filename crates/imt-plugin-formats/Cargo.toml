[package]
name = "imt-plugin-formats"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "IMT plugin: log4j/log4net/NLog XML events, SQL Server ERRORLOG, Docker json-file and Kubernetes CRI container logs"

[dependencies]
imt-plugin-api = { path = "../imt-plugin-api" }
anyhow.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
chrono.workspace = true
regex.workspace = true
quick-xml.workspace = true

[dev-dependencies]
proptest.workspace = true
# End-to-end tests check that no other text-format importer outranks these.
imt-plugin-web = { path = "../imt-plugin-web" }
imt-plugin-syslog = { path = "../imt-plugin-syslog" }
imt-plugin-otel = { path = "../imt-plugin-otel" }
