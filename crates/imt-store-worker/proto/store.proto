// The store worker's service (ADR 0014 §1): the app reaches its stores through one call that carries a
// method name and a JSON body. The envelope keeps the protocol small while R3 replaces the transport and
// codec (ADR 0015); requests and replies are the ports' owned DTOs. Every call needs the per-launch token
// (metadata `x-imt-token`); a failed call carries a typed error in the `x-imt-error-bin` trailer.
syntax = "proto3";

package imt.store.v1;

service Store {
  rpc Call(CallRequest) returns (CallReply);
}

message CallRequest {
  // E.g. "open_store", "summary", "page"; see imt_store_worker::protocol.
  string method = 1;
  // The store handle (0 for calls that are not about one store).
  uint64 store = 2;
  // The request as JSON.
  bytes body = 3;
}

message CallReply {
  // The reply as JSON.
  bytes body = 1;
}
