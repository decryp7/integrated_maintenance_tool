[package]
name = "imt-store-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "IMT's store worker (ADR 0014): hosts the DuckDB stores and their full-text indexes in a supervised child process (the client is imt-store-client)"

[lib]
name = "imt_store_worker"
path = "src/lib.rs"

[[bin]]
name = "imt-store-worker"
path = "src/main.rs"

[dependencies]
imt-alloc = { path = "../imt-alloc" }
imt-core = { path = "../imt-core" }
imt-ipc = { path = "../imt-ipc" }
imt-store-client = { path = "../imt-store-client" }
imt-store-duck = { path = "../imt-store-duck" }
imt-plugin-host = { path = "../imt-plugin-host" }
log.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
getrandom.workspace = true
sysinfo = { workspace = true, features = ["system"] }
