[package]
name = "imt-store-worker"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
publish = false
description = "IMT's store worker (ADR 0014): hosts the DuckDB stores and their full-text indexes in a supervised child process, and the thin client that implements the store ports over imt-ipc"

# Like imt-store-duck, not a workspace member until CI fetches libduckdb (ADR 0014 R2b notes):
#   eval "$(crates/imt-store-duck/scripts/fetch-libduckdb.sh)"
#   cargo test --manifest-path crates/imt-store-worker/Cargo.toml

[workspace]

[lib]
name = "imt_store_worker"
path = "src/lib.rs"

[[bin]]
name = "imt-store-worker"
path = "src/main.rs"

[dependencies]
imt-alloc = { path = "../imt-alloc" }
imt-core = { path = "../imt-core" }
imt-ipc = { path = "../imt-ipc" }
imt-store-duck = { path = "../imt-store-duck" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
getrandom = "0.3"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
