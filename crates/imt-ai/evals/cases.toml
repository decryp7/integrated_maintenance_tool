# Evaluation cases built from /samples. Generated by evals/make_cases.py; expectations are computed from the data.
# Run with: cargo run --release -p imt-ai --example eval -- --model <file.gguf>

[[nl_to_query]]
id = "q1"
question = "show me all errors"
expect_ql = "level >= error || level = error"

[[nl_to_query]]
id = "q2"
question = "which events are fatal"
expect_ql = "level = fatal"

[[nl_to_query]]
id = "q3"
question = "warnings from WEB02"
expect_ql = "level = warning and MachineName = WEB02"

[[nl_to_query]]
id = "q4"
question = "events whose message contains timeout"
expect_ql = "message contains \"timeout\""

[[nl_to_query]]
id = "q5"
question = "errors that mention payment"
expect_ql = "level >= error and message contains \"payment\""

[[nl_to_query]]
id = "q6"
question = "how many events does each machine have"
expect_ql = "| stats count() as n by MachineName"

[[nl_to_query]]
id = "q7"
question = "requests that took more than 2000 ms"
expect_ql = "Elapsed > 2000 || ElapsedMs > 2000"

[[nl_to_query]]
id = "q8"
question = "the five slowest requests"
expect_ql = "exists(Elapsed) | sort Elapsed desc | head 5 || exists(ElapsedMs) | sort ElapsedMs desc | head 5"

[[nl_to_query]]
id = "q9"
question = "everything from the billing log"
expect_ql = "@source contains \"billing\""

[[nl_to_query]]
id = "q10"
question = "events that have an exception"
expect_ql = "exists(@exception)"

