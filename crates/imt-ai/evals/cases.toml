paths = ["serilog-clef/web01"]
facts = ["timeout", "payment", "gateway"]

[[root_causes]]
id = "worker"
paths = ["serilog-text/worker01"]
facts = ["outbox", "backlog", "gateway", "timeout", "orderc"]

[[root_causes]]
id = "billing"
paths = ["log4net/legacy-billing"]
facts = ["erp", "connection", "closed", "communication"]

[[root_causes]]
id = "gateway"
paths = ["serilog-json/gateway"]
facts = ["upstream", "health", "probe", "slow", "502", "503", "504"]

[[root_causes]]
id = "web-tier"
paths = ["serilog-clef/web01", "serilog-clef/web02"]
facts = ["timeout", "payment", "gateway", "sql"]

[[root_causes]]
id = "background"
paths = ["serilog-text/worker01", "log4net/legacy-billing"]
facts = ["outbox", "erp", "backlog", "connection", "timeout"]

[[chat]]
id = "errors-by-machine"
[[chat.turns]]
user = "How many errors are there in total?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "level >= error || level = error"
[[chat.turns]]
user = "How many of those are on WEB02?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "level >= error and MachineName = WEB02 || level = error and MachineName = WEB02"

[[chat]]
id = "warnings-and-fatal"
[[chat.turns]]
user = "How many warnings are in the logs?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "level = warning"
[[chat.turns]]
user = "And how many fatal events are there?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "level = fatal"

[[chat]]
id = "timeouts"
[[chat.turns]]
user = "How many events contain the words \"timed out\" in the message?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "message contains \"timed out\""
[[chat.turns]]
user = "How many of them are errors?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "message contains \"timed out\" and level >= error || message contains \"timed out\" and level = error"

[[chat]]
id = "exceptions"
[[chat.turns]]
user = "How many events carry an exception?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "exists(@exception)"
[[chat.turns]]
user = "What is the most common exception type?"
tools = ["exception_groups", "run_query", "patterns", "overview", "get_events"]
facts = ["TimeoutException", "timeout", "CommunicationException"]

[[chat]]
id = "top-pattern"
[[chat.turns]]
user = "What is the most frequent kind of message in these logs?"
tools = ["patterns", "run_query", "overview"]
facts = ["HTTP", "responded", "request"]
[[chat.turns]]
user = "Which pattern is the most common among the warnings?"
tools = ["patterns", "run_query"]
facts = ["Payment gateway", "gateway", "Outbox", "Waiting", "Slow request"]

[[chat]]
id = "worst-machine"
[[chat.turns]]
user = "Which machine has the most errors?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
facts = ["WEB02"]
[[chat.turns]]
user = "How many errors does it have?"
count_of = "level >= error and MachineName = WEB02 || level = error and MachineName = WEB02"

[[chat]]
id = "billing-log"
[[chat.turns]]
user = "How many events are in the billing log?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "@source contains \"billing\""
[[chat.turns]]
user = "How many of those are warnings?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "@source contains \"billing\" and level = warning"

[[chat]]
id = "slow-requests"
[[chat.turns]]
user = "How many requests took longer than 3000 ms (field Elapsed)?"
tools = ["run_query", "field_stats", "patterns", "overview", "exception_groups"]
count_of = "Elapsed > 3000"
[[chat.turns]]
user = "What was the slowest request time in the Elapsed field?"
tools = ["field_stats", "run_query"]
