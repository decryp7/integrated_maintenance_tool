[package]
name = "imt-cli"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The headless command line: import files into a store, run query-language queries and analyses, build the incident report (docs/cli.md)"

[lib]
name = "imt_cli"
path = "src/lib.rs"

[[bin]]
name = "imt"
path = "src/bin/imt.rs"

[dependencies]
imt-core = { path = "../imt-core" }
# The store worker's client (no database linked); the CLI starts the worker like the app does.
imt-store-client = { path = "../imt-store-client" }
imt-pdf = { path = "../imt-pdf" }
chrono.workspace = true
# Ctrl+C / SIGTERM stop `watch` cleanly.
ctrlc = { workspace = true, features = ["termination"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
imt-store-duck = { path = "../imt-store-duck" }
tempfile.workspace = true
