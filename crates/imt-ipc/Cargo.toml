[package]
name = "imt-ipc"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Local gRPC transport for IMT's worker and plugin processes: private Unix socket / owner-only named pipe, per-launch token, typed error trailer, and a supervisor (restart with backoff, quarantine, no orphans)"

# A fake child process (crash, hang, wrong token, ...) used only by the tests. Never bundled.
[[bin]]
name = "imt-ipc-fake-child"
path = "src/bin/fake_child.rs"
test = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
prost.workspace = true
tonic-prost.workspace = true
sysinfo = { workspace = true, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_JobObjects", "Win32_Security_Authorization", "Win32_System_Memory"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true
