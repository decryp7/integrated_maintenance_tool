[package]
name = "imt-ipc"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "IMT's one IPC (ADR 0017): length-prefixed postcard frames on a private Unix socket / owner-only named pipe, a symmetric peer with credits and cancel, the launcher with sandbox and elevation, the child loop and the supervisor (restart with backoff and restore, quarantine, no orphans)"

# A fake child process (crash, hang, wrong token, another process, garbage, ...) used only by the tests. Never bundled.
[[bin]]
name = "imt-ipc-fake-child"
path = "src/bin/fake_child.rs"
test = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
postcard.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
sysinfo = { workspace = true, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock (file-system sandbox of children, ADR 0017 §6), MIT/Apache-2.0.
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_JobObjects", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

