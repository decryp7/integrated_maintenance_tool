// Test-only service of the fake child process (tests of imt-ipc). Not part of any contract.
syntax = "proto3";

package imt.ipc.testing;

service Echo {
  rpc Echo(EchoRequest) returns (EchoReply);
}

message EchoRequest {
  string text = 1;
  // Sleep this long before answering (deadline tests).
  uint64 delay_ms = 2;
  // "abort" kills the process, "panic" panics in the handler, "error" answers with a typed error.
  string action = 3;
}

message EchoReply {
  string text = 1;
}
