[package]
name = "debrief-alloc"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The global allocator of Debrief's binaries (mimalloc v3) and its start-up tuning (ADR 0014 performance notes)"

[dependencies]
mimalloc.workspace = true
# `mi_option_get`/`mi_option_set` (the `extended` API); the version mimalloc itself links.
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
