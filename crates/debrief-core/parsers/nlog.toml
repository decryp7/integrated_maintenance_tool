# NLog default layout "${longdate}|${level:uppercase=true}|${logger}|${message:withexception=true}" (longdate is
# local time with 4 fraction digits; read as UTC unless you change [format] assume_timezone). The exception NLog
# writes after a "|" at the end of the message is the event's exception; its stack trace follows on the next lines.
schema = 1
id = "nlog"
name = "NLog default layout"
version = "1.0.0"
category = ".NET"
description = "Text from NLog's default layout \"${longdate}|${level}|${logger}|${message}\": logger as a field, multi-line messages kept together."

[format]
kind = "text"
regexes = [
  '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d{1,7})?)\|(?P<level>[A-Za-z]+)\|(?P<Logger>[^|]*)\|(?P<message>.*?)(?:\|(?P<exception>(?:[A-Za-z_][\w`]*\.)*[A-Za-z_][\w`]*(?:Exception|Error)\b.*))?$',
]
