[package]
name = "debrief-core"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Log and file analysis engine for Debrief: importers, parsing profiles, query, timeline and chart aggregation"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
csv.workspace = true
# Legacy text encodings (Shift-JIS, GBK, EUC-KR, Big5, Windows-125x) and their detector (both MIT OR Apache-2.0).
chardetng = "1.0"
encoding_rs = "0.8"
flate2.workspace = true
getrandom.workspace = true
# The event batch (ADR 0014 §3), re-exported as `debrief_core::batch`.
debrief-batch = { path = "../debrief-batch", features = ["serde"] }
globset.workspace = true
# The plugin contract (ADR 0017): records, timestamps, configuration trees, settings and tool schemas live there.
debrief-plugin-api = { path = "../debrief-plugin-api" }
# Logging facade only: guard events (contained crashes, quarantines, abandoned calls) reach the app's log.
log = { workspace = true, features = ["kv"] }
quick-xml.workspace = true
rayon = "1.12"
regex.workspace = true
regex-syntax = "0.8"
# `script` pipeline step: sandboxed embedded language (MIT/Apache-2.0). `sync` so compiled
# scripts are shared across import threads; `no_module` removes `import` and module resolution;
# `no_time` keeps scripts deterministic; `only_i64` matches JSON integers.
rhai = { version = "1.26", features = ["sync", "no_module", "no_custom_syntax", "no_time", "only_i64"] }
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
# YAML for the config diff: maintained, MIT/Apache-2.0, YAML 1.2, with a public event
# API so aliases and nesting are bounded by our own limits (serde_yaml/serde_yml are deprecated).
yaml-rust2 = { version = "0.13", default-features = false }
zip.workspace = true
# TypeScript bindings of the wire types (feature `ts`, ADR 0016).
ts-rs = { version = "11.1", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
# The app's allocator, so benches/engine.rs measures what ships.
debrief-alloc = { path = "../debrief-alloc" }
# Benchmarks (benches/engine.rs) with HTML reports under target/criterion.
criterion = { version = "0.8", features = ["html_reports"] }
# Snapshot tests of importer output (tests/importer_snapshots.rs, snapshots in tests/snapshots/).
insta.workspace = true
proptest.workspace = true

[[bench]]
name = "engine"
harness = false

[features]
# TypeScript bindings of the Store pane's wire types (ports::inspect, ports::console), generated by the app's
# `generated_types` test (ADR 0016).
ts = ["dep:ts-rs"]
