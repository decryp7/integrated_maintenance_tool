[package]
name = "debrief-notes"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Debrief notes (ADR 0021): the user's observations anchored to events, times, sources, markers, chart points, the project or regions of images; their checks and limits, the versioned project record and the AI context block. Pure: no I/O."

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# TypeScript bindings of the wire types, generated by the app's `generated_types` test (ADR 0016).
ts-rs = { version = "11.1", optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
ts = ["dep:ts-rs"]
