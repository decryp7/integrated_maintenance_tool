[package]
name = "cargo-debrief-plugin"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "cargo debrief-plugin: start (new), test (the harness's conformance checks, then cargo test), package and sign (.debriefplugin) Debrief plugins (ADR 0027)"

[[bin]]
name = "cargo-debrief-plugin"
path = "src/main.rs"

[dependencies]
debrief-plugin-api = { path = "../debrief-plugin-api" }
debrief-plugin-package = { path = "../debrief-plugin-package" }
debrief-plugin-test = { path = "../debrief-plugin-test" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
