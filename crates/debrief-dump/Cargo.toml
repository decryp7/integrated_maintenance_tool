[package]
name = "debrief-dump"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Debrief dump engine (ADR 0023): the model of crash/memory dumps and UMDH heap logs, its wire form from the dumps plugin's process, and every analysis over it (findings, UMDH diffs, the AI summary). Pure: no I/O."

[dependencies]
# PDB identities (name, GUID, age) as symbol stores file them; pure (no DbgHelp, no downloads).
debrief-symbols = { path = "../debrief-symbols", default-features = false }
# The document on the wire from the dumps plugin's process (`wire`, ADR 0017).
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
# TypeScript bindings of the query DTOs (`api`), generated by the app's `generated_types` test (ADR 0016).
ts-rs = { version = "11.1", optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[features]
ts = ["dep:ts-rs"]
