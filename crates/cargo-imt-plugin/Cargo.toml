[package]
name = "cargo-imt-plugin"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "cargo imt-plugin: start (new), test (the harness's conformance checks, then cargo test), package and sign (.imtplugin) IMT plugins (ADR 0027)"

[[bin]]
name = "cargo-imt-plugin"
path = "src/main.rs"

[dependencies]
imt-plugin-api = { path = "../imt-plugin-api" }
imt-plugin-package = { path = "../imt-plugin-package" }
imt-plugin-test = { path = "../imt-plugin-test" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
