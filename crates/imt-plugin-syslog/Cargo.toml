[package]
name = "imt-plugin-syslog"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
imt-core = { path = "../imt-core" }
anyhow = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = "0.4.45"

[dev-dependencies]
# Snapshot tests of the importers against /samples (tests/samples.rs, snapshots in tests/snapshots/).
insta = { version = "1", features = ["yaml"] }
proptest = "1"
