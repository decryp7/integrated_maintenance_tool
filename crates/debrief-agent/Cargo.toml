[package]
name = "debrief-agent"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Headless Debrief agent: scheduled and triggered diagnostics collection, as a CLI or an OS service"

[lib]
name = "debrief_agent"
path = "src/lib.rs"

[[bin]]
name = "debrief-agent"
path = "src/bin/debrief-agent.rs"

[dependencies]
debrief-core = { path = "../debrief-core" }
debrief-collect = { path = "../debrief-collect" }
debrief-monitor = { path = "../debrief-monitor" }
# PerfMon Data Collector Set control (`logman`), shared with the tools plugin.
debrief-plugin-tools = { path = "../debrief-plugin-tools" }
anyhow.workspace = true
chrono.workspace = true
# Cron expressions (MIT): 5/6-field POSIX/Vixie patterns, aliases, L/W/#, time zones via chrono.
croner = "4.0.1"
globset.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
# Free disk space and PID liveness (already in the dependency tree).
sysinfo = { workspace = true, features = ["system", "disk"] }
thiserror.workspace = true
toml.workspace = true
# Saving debrief-agent.toml in place, keeping the user's comments (MIT OR Apache-2.0).
toml_edit = "0.25"
ctrlc = { workspace = true, features = ["termination"] }

[target.'cfg(windows)'.dependencies]
# Windows Service Control Manager integration (MIT OR Apache-2.0).
windows-service = "0.8.1"

[dev-dependencies]
tempfile.workspace = true
