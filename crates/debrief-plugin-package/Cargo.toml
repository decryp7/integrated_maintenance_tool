[package]
name = "debrief-plugin-package"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The .debriefplugin package of third-party Debrief plugins (ADR 0027): a bounded, validated zip with manifest.toml and per-target binaries, an ed25519 signature over a canonical digest, publisher keys and the trust decision. Pure: no app state."

[dependencies]
debrief-plugin-api = { path = "../debrief-plugin-api" }
# Ed25519 signatures (MIT, no dependencies): the publisher's signature over the package digest.
ed25519-compact = { version = "2.6", default-features = false, features = ["std"] }
getrandom.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
zip.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
