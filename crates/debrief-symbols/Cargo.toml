[package]
name = "debrief-symbols"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Native symbols for Debrief (ADR 0022): PE/PDB identities, symbol paths and cache, optional symbol-server downloads, DbgHelp symbolisation and stack walking; shared by the native profiler and dump analysis"

[dependencies]
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[features]
default = ["server", "dbghelp"]
# Downloads from symbol servers (only those the user enables).
server = ["dep:ureq"]
# The DbgHelp resolver and stack walker (Windows). Without it the crate is pure: identities, the cache, downloads.
dbghelp = ["dep:windows"]
