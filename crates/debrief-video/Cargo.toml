[package]
name = "debrief-video"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Video sources (ADR 0033): the downloadable FFmpeg runtime (pinned LGPL builds, verified, self-tested, updated with rollback), sandboxed ffmpeg/ffprobe runs, frame selection, alignment to the logs and the video records kept in the project"

# A fake ffmpeg/ffprobe (scripted output, hang, memory hog, bad output) used only by the tests. Never bundled.
[[bin]]
name = "debrief-video-fake-ffmpeg"
path = "src/bin/fake_ffmpeg.rs"
test = false

[dependencies]
debrief-core = { path = "../debrief-core" }
debrief-ai = { path = "../debrief-ai" }
debrief-ipc = { path = "../debrief-ipc" }
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true
tar = { version = "0.4", default-features = false }
# The Linux builds are .tar.xz: a pure-Rust decoder (MIT), no liblzma.
lzma-rs = "0.3"
# TypeScript bindings of the wire DTOs (`api`), generated by the app's `generated_types` test (ADR 0016).
ts-rs = { version = "11.1", optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[features]
ts = ["dep:ts-rs"]
