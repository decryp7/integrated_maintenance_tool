[package]
name = "imt-plugin-tools"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "IMT tools plugin: Performance Monitor collector sets, the process monitor, the Event Log follower, the diagnostics collector and elevation info"

[dependencies]
imt-core = { path = "../imt-core" }
imt-plugin-api = { path = "../imt-plugin-api" }
imt-monitor = { path = "../imt-monitor" }
imt-collect = { path = "../imt-collect" }
imt-plugin-windows = { path = "../imt-plugin-windows" }
anyhow.workspace = true
chrono.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
