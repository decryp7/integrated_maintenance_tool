[package]
name = "debrief-plugin-host"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Out-of-process plugins for Debrief (ADR 0017), host side: plugin processes as ordinary engine plugins, supervised, sandboxed by their manifest's permissions, with an elevated process for operations that need administrator rights"

# A plugin process that misbehaves on demand, for the supervision tests. Never bundled.
[[bin]]
name = "debrief-plugin-host-fake"
path = "src/bin/fake_plugin.rs"
test = false

[dependencies]
debrief-core = { path = "../debrief-core" }
debrief-ipc = { path = "../debrief-ipc" }
debrief-plugin-api = { path = "../debrief-plugin-api" }
debrief-plugin-package = { path = "../debrief-plugin-package" }
debrief-profile = { path = "../debrief-profile" }
debrief-dump = { path = "../debrief-dump" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tempfile.workspace = true
