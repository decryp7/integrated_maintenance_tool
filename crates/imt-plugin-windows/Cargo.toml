[package]
name = "imt-plugin-windows"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
imt-plugin-api = { path = "../imt-plugin-api" }
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
evtx = { version = "0.12", default-features = false }
quick-xml.workspace = true
chrono.workspace = true
csv.workspace = true
minidump = "0.27"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_EventLog"] }

[dev-dependencies]
# Snapshot tests of the importers against /samples (tests/samples.rs, snapshots in tests/snapshots/).
insta.workspace = true
proptest.workspace = true
