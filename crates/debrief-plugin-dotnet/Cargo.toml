[package]
name = "debrief-plugin-dotnet"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Debrief plugin: event-based .NET profiling (ETW and EventPipe captures written as NetTrace, .etl import); nothing is loaded into the target"

[dependencies]
debrief-plugin-api = { path = "../debrief-plugin-api", optional = true }
debrief-profile = { path = "../debrief-profile" }
debrief-plugin-profiling = { path = "../debrief-plugin-profiling", default-features = false }
debrief-etw = { path = "../debrief-etw" }
anyhow = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
] }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
# The plugin adapter (debrief-plugin-api, ADR 0017): the `dotnet-profiler` tool and the `.etl` importer.
# Without it the crate is the pure capture library, which is what the fuzz targets build.
default = ["plugin"]
plugin = ["dep:debrief-plugin-api", "dep:anyhow", "dep:serde_json"]
