[package]
name = "debrief-plugin-api"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The contract of Debrief plugins (ADR 0017): plugin traits, the values plugins build (records, timestamps, configuration trees, settings, tools, marker kinds, annotations), the manifest, the plugin protocol over debrief-ipc frames, and serve(). No dependency on debrief-core."

[dependencies]
debrief-ipc = { path = "../debrief-ipc" }
anyhow.workspace = true
chrono.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true

[dev-dependencies]
postcard.workspace = true
tempfile.workspace = true
# In-memory connections for the output-stream tests.
tokio = { workspace = true, features = ["io-util"] }
