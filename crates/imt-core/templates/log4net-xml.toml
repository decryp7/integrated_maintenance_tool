# log4net XmlLayout / XmlLayoutSchemaLog4j: one <log4net:event> (or <log4j:event>)
# per line; exceptions continue on the following lines.
name = "log4net XML"

[parse]
format = "text"
output_templates = []
regexes = [
  '^<log4(?:net|j):event logger="(?P<Logger>[^"]*)" timestamp="(?P<timestamp>[^"]+)" level="(?P<level>[^"]+)" thread="(?P<Thread>[^"]*)"[^>]*>\s*<log4(?:net|j):message>(?:<!\[CDATA\[)?(?P<message>.*?)(?:\]\]>)?</log4(?:net|j):message>',
]

[instance]
candidates = ["Logger", "Thread"]
key = []
