# NLog default layout "${longdate}|${level:uppercase=true}|${logger}|${message}"
# (longdate is local time with 4 fraction digits; read as UTC unless you change
# [parse] assume_timezone).
name = "NLog default layout"

[parse]
format = "text"
output_templates = []
regexes = [
  '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d{1,7})?)\|(?P<level>[A-Za-z]+)\|(?P<Logger>[^|]*)\|(?P<message>.*)$',
]
