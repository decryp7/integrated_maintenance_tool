# Windows event logs (.evtx), read by the Windows plugin: Provider, EventId,
# Channel, Computer, ProcessId and the event data as fields; the event level
# sets the level. Instances are computers and providers.
name = "Windows Event Log (EVTX)"

[parse]
format = "auto"

[instance]
key = ["Computer", "Provider"]

[activity]
user = ["UserId", "TargetUserName", "SubjectUserName"]
action = ["EventId", "Task"]
metrics = []

[[chart]]
id = "events-by-level"
title = "Events per interval by level"
y = "count()"
bucket = "auto"
split_by = ["@level"]
type = "stacked"
unit = "events"

[[chart]]
id = "events-by-provider"
title = "Events per interval by provider"
y = "count()"
bucket = "auto"
split_by = ["Provider"]
type = "stacked"
unit = "events"
