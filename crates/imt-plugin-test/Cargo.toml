[package]
name = "imt-plugin-test"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Test harness for IMT plugins (ADR 0027): launches a plugin binary out of process exactly as IMT does (same launcher and sandbox, a fake host), conformance checks and golden tests. A dev-dependency of plugin crates; never linked by IMT."

# A plugin that misbehaves on request (panics, hangs, oversized output), for the harness's own tests. Never bundled.
[[bin]]
name = "imt-plugin-test-fixture"
path = "src/bin/fixture.rs"
test = false

[dependencies]
imt-ipc = { path = "../imt-ipc" }
imt-plugin-api = { path = "../imt-plugin-api" }
imt-plugin-package = { path = "../imt-plugin-package" }
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true
