[package]
name = "imt-plugin-host"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Out-of-process plugins for IMT (ADR 0017), host side: plugin processes as ordinary engine plugins, supervised, sandboxed by their manifest's permissions, with an elevated process for operations that need administrator rights"

# A plugin process that misbehaves on demand, for the supervision tests. Never bundled.
[[bin]]
name = "imt-plugin-host-fake"
path = "src/bin/fake_plugin.rs"
test = false

[dependencies]
imt-core = { path = "../imt-core" }
imt-ipc = { path = "../imt-ipc" }
imt-plugin-api = { path = "../imt-plugin-api" }
imt-profile = { path = "../imt-profile" }
imt-dump = { path = "../imt-dump" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tempfile.workspace = true
