[package]
name = "imt-etw"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "ETW for IMT's profilers: kernel and heap event decoders, the ETW -> NetTrace converter, the streaming NetTrace writer, .etl reading and real-time sessions (ADR 0019, ADR 0022)"

[dependencies]
# Only the encoders of IMT's NetTrace extension events (no plugin adapter).
imt-plugin-profiling = { path = "../imt-plugin-profiling", default-features = false }
imt-profile = { path = "../imt-profile" }
serde.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Performance",
    "Win32_System_Time",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
