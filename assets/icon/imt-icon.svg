<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222C40"/>
      <stop offset="1" stop-color="#0D1118"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DB0FF"/>
      <stop offset="1" stop-color="#3B74E6"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#2C5BC4"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#2E3D5C"/>
      <stop offset="1" stop-color="#151C2A"/>
    </radialGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <clipPath id="lens">
      <circle cx="560" cy="450" r="126"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Body -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>

  <g clip-path="url(#body)">
    <!-- Time grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="4">
      <line x1="300" y1="190" x2="300" y2="834"/>
      <line x1="460" y1="190" x2="460" y2="834"/>
      <line x1="620" y1="190" x2="620" y2="834"/>
      <line x1="780" y1="190" x2="780" y2="834"/>
    </g>

    <!-- Instance lanes: a crash on the second, a restart on the last -->
    <rect x="196" y="214" width="600" height="60" rx="30" fill="#45536F"/>
    <rect x="196" y="420" width="364" height="60" rx="30" fill="#45536F"/>
    <rect x="196" y="580" width="168" height="60" rx="30" fill="#45536F" fill-opacity="0.55"/>
    <rect x="600" y="740" width="228" height="60" rx="30" fill="#45536F"/>

    <!-- Markers outside the lens -->
    <path d="M226 222 L262 244 L226 266 Z" fill="#3FBF7F"/>
    <path d="M436 224 L460 266 L412 266 Z" fill="#E9AE3F"/>
    <path d="M226 428 L262 450 L226 472 Z" fill="#3FBF7F"/>
    <path d="M630 748 L666 770 L630 792 Z" fill="#3FBF7F"/>
  </g>

  <!-- Lens -->
  <g filter="url(#shadow)">
    <line x1="666" y1="556" x2="770" y2="660" stroke="url(#handle)" stroke-width="72" stroke-linecap="round"/>
    <circle cx="560" cy="450" r="150" fill="url(#glass)"/>
  </g>

  <!-- Magnified view: the crash and the restart -->
  <g clip-path="url(#lens)">
    <g transform="translate(560 450) scale(1.55) translate(-560 -450)">
      <rect x="380" y="420" width="180" height="60" rx="30" fill="#6E7FA6"/>
      <rect x="380" y="214" width="420" height="60" rx="30" fill="#6E7FA6" fill-opacity="0.6"/>
    </g>
    <!-- Fatal marker, kept crisp at the lens centre -->
    <path d="M560 384 L626 450 L560 516 L494 450 Z" fill="#FF4F8B"/>
    <path d="M560 384 L626 450 L560 516 L494 450 Z" fill="none" stroke="#151C2A" stroke-width="10" stroke-linejoin="round"/>
    <!-- Glass highlight -->
    <path d="M454 398 A 112 112 0 0 1 536 332" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round"/>
  </g>
  <circle cx="560" cy="450" r="150" fill="none" stroke="url(#ring)" stroke-width="40"/>
</svg>
